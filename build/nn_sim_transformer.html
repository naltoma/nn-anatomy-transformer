<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NN Anatomy — Transformer</title>
    <style>
/* NN Anatomy — Transformer 版 スタイル
 * 設計書 §4 (画面レイアウト) と §7 (可視化) に対応。
 * 3 領域 grid: コントロールバー (上) / ネットワーク・ビュー (中央左) / 補助パネル (右)。
 */

:root {
  --bg: #fafafa;
  --pane-bg: #ffffff;
  --border: #d8d8d8;
  --fg: #222;
  --fg-muted: #6b6b6b;
  --selected: #f59e0b;
  --pos: #2b6cb0;       /* セル正値 (赤系/青系どちらにも変えられる) */
  --neg: #c53030;
  --attn-fill: #2b6cb0; /* Attention map 用の単一色 (青濃淡) */
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
               "Noto Sans CJK JP", sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 13px;
}

/* 行列ヒートマップは横長 (T=5 × d_model=16 = 800 px 幅) なので、
   左右分割ではなく上下分割で「メインビューに画面幅をフルに使わせる」レイアウトを採用。
   - 1 段目: コントロールバー (auto 高さ)
   - 2 段目: ネットワーク・ビュー (1fr、可変。フル幅で行列を表示)
   - 3 段目: 補助パネル (固定 320 px、式の展開・Attention Map・レッスン・ログを横タブで切替) */
body {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: auto 1fr 320px;
  grid-template-areas:
    "controls"
    "network"
    "side";
  gap: 8px;
  padding: 8px;
}

.pane {
  background: var(--pane-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
  overflow: hidden;
}

.pane-controls { grid-area: controls; }
.pane-network  { grid-area: network; position: relative; }
.pane-side     { grid-area: side; display: flex; flex-direction: column; min-height: 0; }

/* ── コントロールバー ───────────────────────────────────── */

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}
.row label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--fg-muted);
}
.row select, .row input[type="text"], .row input[type="number"] {
  padding: 2px 6px;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fff;
  font-family: inherit;
}
.row button {
  padding: 4px 10px;
  font-size: 12px;
  border: 1px solid var(--border);
  background: #f5f5f5;
  border-radius: 4px;
  cursor: pointer;
}
.row button:hover:not(:disabled) { background: #ebebeb; }
.row button:disabled { opacity: 0.4; cursor: not-allowed; }

.spacer { flex: 1; }

.phase-badge {
  font-size: 12px;
  color: var(--fg-muted);
  font-family: monospace;
}
.phase-badge #phase-label {
  color: var(--fg);
  font-weight: 600;
}

/* ── タブ ───────────────────────────────────────────────── */

.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.tab {
  padding: 6px 12px;
  font-size: 12px;
  border: 0;
  background: transparent;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  color: var(--fg-muted);
}
.tab:hover { color: var(--fg); }
.tab.tab-active {
  color: var(--fg);
  font-weight: 600;
  border-bottom-color: var(--selected);
}

.tab-panel { display: none; flex: 1; overflow: auto; padding: 4px; }
.tab-panel.tab-panel-active { display: block; }

/* ── ネットワーク・ビュー ───────────────────────────────── */

.pane-network { display: flex; flex-direction: column; }

.zoom-controls {
  position: absolute;
  top: 6px;
  right: 8px;
  display: flex;
  gap: 4px;
  align-items: center;
  z-index: 5;
  background: rgba(255, 255, 255, 0.85);
  padding: 2px 4px;
  border: 1px solid var(--border);
  border-radius: 4px;
}
.zoom-controls button {
  font-size: 11px;
  padding: 2px 6px;
  border: 1px solid var(--border);
  background: #f5f5f5;
  border-radius: 3px;
  cursor: pointer;
}
.zoom-controls button:hover { background: #ebebeb; }
.zoom-label {
  font-family: monospace;
  font-size: 11px;
  color: var(--fg-muted);
  min-width: 38px;
  text-align: right;
}

#net-svg {
  flex: 1;
  width: 100%;
  height: 100%;
  cursor: grab;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
#net-svg.dragging { cursor: grabbing; }

/* SVG 内部要素 */

.matrix-label {
  font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", sans-serif;
  font-size: 12px;
  font-weight: 600;
  fill: var(--fg);
}
.matrix-shape-label {
  font-family: monospace;
  font-size: 10px;
  fill: var(--fg-muted);
}
.row-label {
  font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", sans-serif;
  font-size: 11px;
  fill: var(--fg);
  text-anchor: end;
}
.col-label {
  font-family: monospace;
  font-size: 9px;
  fill: var(--fg-muted);
  text-anchor: middle;
}
.cell-rect {
  stroke: #d8d8d8;
  stroke-width: 0.5;
}
.cell-rect:hover {
  stroke: var(--selected);
  stroke-width: 1.5;
}
.cell-rect.cell-selected {
  stroke: var(--selected);
  stroke-width: 2;
}
.cell-text {
  font-family: monospace;
  font-size: 9px;
  fill: var(--fg);
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}

/* Attention map: 単色青濃淡。値が大きいほど濃い青 */
.attn-cell-text {
  fill: var(--fg);
  font-weight: 600;
}
.attn-cell-text.dark {
  fill: #fff;
}

/* ── 補助パネル ────────────────────────────────────────── */

.pane-side .tab-panel {
  font-size: 12px;
  line-height: 1.6;
}
.muted { color: var(--fg-muted); font-size: 12px; }
.event-log {
  font-family: monospace;
  font-size: 11px;
  margin: 0;
  padding-left: 24px;
  list-style: decimal;
}
.event-log li { padding: 2px 0; color: var(--fg); }

/* ── 「式の展開」パネル ────────────────────────────────── */

.explain-section { padding: 4px 0; }
.explain-section h4 {
  margin: 8px 0 4px;
  font-size: 13px;
}
.explain-section h4.step-h {
  font-size: 12px;
  color: var(--fg-muted);
  margin-top: 6px;
}
.math {
  background: #f5f7f9;
  border: 1px solid #e3e6ea;
  border-radius: 4px;
  padding: 6px 10px;
  font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", sans-serif;
  font-size: 13px;
  line-height: 1.7;
}
.math .line { padding: 1px 0; }
.math .line + .line { margin-top: 2px; }
.mnum {
  font-family: monospace;
  background: #fff;
  padding: 0 3px;
  border-radius: 2px;
  border: 1px solid #e0e0e0;
}
.mop {
  color: var(--fg-muted);
  margin: 0 1px;
}
.muted.note {
  font-size: 11px;
  margin-top: 6px;
  padding: 4px 8px;
  background: #fffbe6;
  border-left: 2px solid #f0c040;
  border-radius: 2px;
}
.comment {
  color: var(--fg-muted);
  font-style: italic;
}

/* ── レッスンカード ──────────────────────────────────── */

.lesson-card {
  padding: 4px;
}
.lesson-card h3 {
  margin: 0 0 4px 0;
  font-size: 14px;
}
.lesson-card .lesson-hint {
  margin: 0 0 8px 0;
  font-size: 12px;
  line-height: 1.6;
  padding: 6px 10px;
  background: #f5f7f9;
  border-left: 3px solid var(--selected);
  border-radius: 2px;
  /* hint 内に \n を入れると改行、\n\n で段落区切りとして描画される。 */
  white-space: pre-line;
}
.lesson-card h4 {
  margin: 8px 0 4px 0;
  font-size: 13px;
}
.lesson-card ol.lesson-checks {
  margin: 4px 0 0 0;
  padding-left: 20px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--fg);
}
.lesson-card ol.lesson-checks li {
  padding: 4px 0;
  /* lesson check 内に \n\n を入れると段落区切りとして描画される
     (例: 💡 補足 を別段落に分けるため)。 */
  white-space: pre-line;
}

/* ── Attention Map (補助パネル常駐表示) ──────────────── */

.attmap-table {
  border-collapse: collapse;
  font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", sans-serif;
  font-size: 11px;
}
.attmap-table th, .attmap-table td {
  border: 1px solid #d8d8d8;
  padding: 4px 8px;
  text-align: center;
}
.attmap-table th { background: #f5f5f5; font-weight: 600; }
.attmap-cell {
  font-family: monospace;
  font-weight: 600;
  min-width: 56px;
}
.attmap-head {
  margin-bottom: 8px;
}
.attmap-head-title {
  font-size: 12px;
  font-weight: 600;
  margin: 6px 0 2px 0;
  color: var(--muted);
}

/* ── Q·K dim 抜粋表 (scores セルクリック時の補助) ─────── */

.qk-excerpt {
  margin: 8px 0;
  padding: 6px 8px;
  background: #f7f9fb;
  border-left: 3px solid var(--selected);
  border-radius: 2px;
}
.qk-excerpt-cap {
  margin: 0 0 4px 0;
  font-size: 11px;
  color: var(--muted);
}
.qk-pair-table {
  border-collapse: collapse;
  font-size: 11px;
  font-family: monospace;
}
.qk-pair-table th, .qk-pair-table td {
  border: 1px solid #d8d8d8;
  padding: 2px 6px;
  text-align: center;
  min-width: 48px;
}
.qk-pair-table thead th { background: #eef0f2; font-weight: 600; }
.qk-pair-table tbody th { background: #f5f5f5; font-weight: 600; text-align: right; }
.qk-pair-table .qk-prod-row td { background: #fff8e1; font-weight: 600; }

</style>
  </head>
  <body>
    <!-- [A] コントロールバー ────────────────────────────────── -->
    <header id="controls" class="pane pane-controls">
      <div class="row">
        <label>
          Lesson
          <select id="lesson">
            <option value="" selected>— (custom)</option>
            <!-- controller.js が LESSONS から option を生成 -->
          </select>
        </label>

        <label>
          Sample
          <select id="sample">
            <!-- controller.js が tokenizer の SAMPLE_SENTENCES から生成 -->
          </select>
        </label>

        <button id="btn-forward">Forward</button>
        <button id="btn-reset">Reset</button>

        <span class="spacer"></span>

        <span class="phase-badge">
          phase: <span id="phase-label">idle</span>
        </span>
      </div>
    </header>

    <!-- [B] ネットワーク・ビュー ───────────────────────────── -->
    <main id="network" class="pane pane-network">
      <nav class="tabs view-tabs" role="tablist">
        <button class="tab tab-active" data-view-tab="embed">Embed</button>
        <button class="tab" data-view-tab="qkv">Q/K/V</button>
        <button class="tab" data-view-tab="attn">Attn</button>
        <button class="tab" data-view-tab="out">Out</button>
        <button class="tab" data-view-tab="ffn">FFN</button>
      </nav>
      <div class="zoom-controls">
        <button id="btn-zoom-fit" title="全体表示にリセット">⤢ Fit</button>
        <button id="btn-zoom-100" title="100% 表示">100%</button>
        <button id="btn-zoom-out" title="−10% (中心アンカー)">−10%</button>
        <button id="btn-zoom-in"  title="+10% (中心アンカー)">+10%</button>
        <span id="zoom-label" class="zoom-label">1.0×</span>
      </div>
      <svg id="net-svg" role="img" aria-label="transformer matrices">
        <!-- view.js が描画する -->
      </svg>
    </main>

    <!-- [C] 補助パネル ────────────────────────────────────── -->
    <aside id="side" class="pane pane-side">
      <nav class="tabs side-tabs" role="tablist">
        <button class="tab tab-active" data-side-tab="explain">式の展開</button>
        <button class="tab" data-side-tab="attmap">Attention Map</button>
        <button class="tab" data-side-tab="lesson">レッスン</button>
        <button class="tab" data-side-tab="log">イベントログ</button>
      </nav>

      <section class="tab-panel tab-panel-active" data-side-panel="explain">
        <div id="explain-body">
          <p class="muted">
            行列のセル (例: Q[T2 美しい, 3]) をクリックすると、ここにそのセルの計算式が表示されます (P5 で実装予定)。
          </p>
        </div>
      </section>

      <section class="tab-panel" data-side-panel="attmap">
        <div id="attmap-body">
          <p class="muted">
            Forward 後、Attention Map (T × T) がここに常駐表示されます (P5 で実装予定)。
          </p>
        </div>
      </section>

      <section class="tab-panel" data-side-panel="lesson">
        <div id="lesson-body">
          <p class="muted">
            Lesson セレクタから Lesson 1〜Lesson 10 を選ぶと、ここに目的と「このレッスンでチェックすること (3 つ)」が表示されます。
          </p>
        </div>
      </section>

      <section class="tab-panel" data-side-panel="log">
        <ol id="event-log" class="event-log"></ol>
      </section>
    </aside>

    <script type="module">
// === bundled by tools/bundle.py — 直接編集しないこと ===
// src/js/*.js を依存順に連結し、import 文を削除し、`export ` を剥がした。
// 詳細: tools/bundle.py のモジュール docstring を参照。

// ---------- rng.js ----------

// rng.js — 単一マスター seed から独立なサブストリームを導出する。
// 設計書 §6.5 / §6.6 に対応。ES modules。

/**
 * サブストリーム tag。将来 v2 でバッチシャッフル等を足すときは
 * ここに SHUFFLE などを追記するだけ。
 */
const SUB = Object.freeze({
  WEIGHTS: 0xa5a5a5a5,
  DATA: 0x5a5a5a5a,
});

/**
 * Mulberry32: 32-bit 状態の軽量 PRNG。
 * seed → [0,1) を返す関数 (以降 rng と呼ぶ)。
 * 同じ seed からは必ず同じ列を返す (bitwise 一致)。
 */
function mulberry32(seed) {
  let t = seed >>> 0;
  return function () {
    t = (t + 0x6d2b79f5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * 標準正規分布からのサンプリング (Box-Muller)。
 * rng は mulberry32() などの [0,1) 返す関数。
 * 1 回呼ぶごとに rng を 2 回消費する。
 */
function randn(rng) {
  const u1 = Math.max(rng(), 1e-12); // log(0) ガード
  const u2 = rng();
  return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
}

/**
 * マスター seed と tag からサブシードを導出する。
 * XOR だけ。Mulberry32 側の状態発散が十分カオティックなので相関は実用上ゼロ。
 */
function deriveSubSeed(masterSeed, tag) {
  return ((masterSeed >>> 0) ^ (tag >>> 0)) >>> 0;
}

/**
 * ユーザーがシードを指定しなかったときの自動 seed。
 * Date.now() は秒単位で粗いので Math.random() と XOR して混ぜる。
 * 本関数の戻り値は必ず seedUsed として記録し、ログ・JSON に残すこと。
 */
function autoSeed() {
  return (Date.now() ^ Math.floor(Math.random() * 2 ** 31)) >>> 0;
}


// ---------- tokenizer.js ----------

// tokenizer.js — 16 語固定の日本語語彙。
// 設計書 §6.1 vocabulary 表に対応。長さ T=5 のサンプル文 (§6.2) も同梱。

/**
 * 語彙 (id 0..15)。順序は設計書 §6.1 と同じ。
 *   0-2: 指示詞・代名詞
 *   3-6: 名詞
 *   7-9: 形容詞
 *   10-11: 動詞
 *   12-14: 助詞
 *   15: コピュラ
 */
const VOCAB = Object.freeze([
  "これ",   //  0
  "それ",   //  1
  "私",     //  2
  "猫",     //  3
  "花",     //  4
  "本",     //  5
  "小説",   //  6
  "大きい", //  7
  "美しい", //  8
  "人気",   //  9
  "読む",   // 10
  "好き",   // 11
  "は",     // 12
  "が",     // 13
  "を",     // 14
  "です",   // 15
]);

const VOCAB_SIZE = VOCAB.length;

/** 単語 → ID の逆引き表。Object.create(null) で prototype 汚染を避ける。 */
const WORD2ID = (() => {
  const m = Object.create(null);
  for (let i = 0; i < VOCAB.length; i++) m[VOCAB[i]] = i;
  return Object.freeze(m);
})();

/**
 * 単語を ID に。語彙外の単語が来たらエラー。
 * @param {string} word
 * @returns {number}
 */
function word2id(word) {
  if (!(word in WORD2ID)) {
    throw new Error(`Unknown word: ${JSON.stringify(word)}`);
  }
  return WORD2ID[word];
}

/**
 * ID を単語に。範囲外の ID が来たらエラー。
 * @param {number} id
 * @returns {string}
 */
function id2word(id) {
  if (!Number.isInteger(id) || id < 0 || id >= VOCAB.length) {
    throw new Error(`id out of range: ${id}`);
  }
  return VOCAB[id];
}

/**
 * 単語列を ID 列 (Int32Array) に変換。
 * @param {string[]} words
 * @returns {Int32Array}
 */
function encode(words) {
  const out = new Int32Array(words.length);
  for (let i = 0; i < words.length; i++) out[i] = word2id(words[i]);
  return out;
}

/**
 * ID 列を単語列に変換。
 * @param {Int32Array | number[]} ids
 * @returns {string[]}
 */
function decode(ids) {
  const out = [];
  for (let i = 0; i < ids.length; i++) out.push(id2word(ids[i]));
  return out;
}

/**
 * 設計書 §6.2 のサンプル文 8 つ (T=5 固定)。
 * デフォルト preset (japanese-mini-v1) もこれら 8 文の next-token prediction で
 * 学習される。UI の Sentence セレクタからこれらを直接選べるようにする想定。
 */
const SAMPLE_SENTENCES = Object.freeze([
  Object.freeze(["これ", "は", "美しい", "花", "です"]),
  Object.freeze(["それ", "は", "人気", "小説", "です"]),
  Object.freeze(["私",   "は", "猫",     "が", "好き"]),
  Object.freeze(["私",   "は", "本",     "を", "読む"]),
  Object.freeze(["私",   "は", "小説",   "を", "読む"]),
  Object.freeze(["大きい", "猫", "は", "美しい", "です"]),
  Object.freeze(["美しい", "花", "は", "人気",   "です"]),
  Object.freeze(["これ", "は", "大きい", "本", "です"]),
]);


// ---------- matrix.js ----------

// matrix.js — flat-array ベースの行列演算ヘルパ。
//
// すべての行列は Float64Array の 1 次元配列で、(rows, cols) の組と一緒に渡す。
// アクセスは A[r * cols + c]。
// このスタイルは Transformer のような matmul 中心の計算で速く、
// 後で WebGPU / SIMD 化する場合にも転用しやすい。
//
// 数値検証は tests/js/test_matrix.test.mjs で PyTorch fixture (float64) と
// 1e-12 オーダで一致することを担保している。

/**
 * 行列積 C = A · B
 *   A: shape (M, K), B: shape (K, N) → C: shape (M, N)
 * すべて Float64Array。out が省略されたら新しく確保して返す。
 *
 * 実装は素朴な 3 重ループ。教育用の規模 (T=5, d_model=16) では十分。
 */
function matmul(A, M, K, B, N, out) {
  const C = out ?? new Float64Array(M * N);
  for (let i = 0; i < M; i++) {
    for (let j = 0; j < N; j++) {
      let s = 0;
      for (let k = 0; k < K; k++) {
        s += A[i * K + k] * B[k * N + j];
      }
      C[i * N + j] = s;
    }
  }
  return C;
}

/**
 * 行ごとの softmax。x: (rows, cols) → 各行を独立に softmax。
 * 数値安定化のため、行ごとの max を引いてから exp する (overflow 防止)。
 * PyTorch の torch.softmax(x, dim=-1) と数値一致する。
 */
function softmax(x, rows, cols, out) {
  const y = out ?? new Float64Array(rows * cols);
  for (let r = 0; r < rows; r++) {
    const off = r * cols;
    // 行ごとの max
    let m = -Infinity;
    for (let c = 0; c < cols; c++) {
      const v = x[off + c];
      if (v > m) m = v;
    }
    // exp(x - m) と総和
    let s = 0;
    for (let c = 0; c < cols; c++) {
      const e = Math.exp(x[off + c] - m);
      y[off + c] = e;
      s += e;
    }
    // 正規化
    const inv = 1 / s;
    for (let c = 0; c < cols; c++) {
      y[off + c] *= inv;
    }
  }
  return y;
}

/**
 * 行ごとの LayerNorm (PyTorch の F.layer_norm と同等):
 *   mean   = sum(x_r) / cols
 *   var    = sum((x_r - mean)^2) / cols    (バイアス補正なし、PyTorch と同じ)
 *   y_r    = (x_r - mean) / sqrt(var + eps) * gamma + beta
 *
 * gamma, beta は長さ cols のベクトル (Float64Array)。
 * eps のデフォルトは PyTorch と揃えて 1e-5。
 *
 * 注: PyTorch の var は分母が cols (有偏) なので Math.sqrt(var + eps) は
 *     1/cols の分散基準。これに合わせるのが大事 (1/(cols-1) ではない)。
 */
function layerNorm(x, rows, cols, gamma, beta, eps = 1e-5, out) {
  const y = out ?? new Float64Array(rows * cols);
  const invCols = 1 / cols;
  for (let r = 0; r < rows; r++) {
    const off = r * cols;
    // mean
    let mean = 0;
    for (let c = 0; c < cols; c++) mean += x[off + c];
    mean *= invCols;
    // variance
    let varSum = 0;
    for (let c = 0; c < cols; c++) {
      const d = x[off + c] - mean;
      varSum += d * d;
    }
    const variance = varSum * invCols;
    const invStd = 1 / Math.sqrt(variance + eps);
    // normalize + scale + shift
    for (let c = 0; c < cols; c++) {
      y[off + c] = (x[off + c] - mean) * invStd * gamma[c] + beta[c];
    }
  }
  return y;
}

/**
 * GELU 活性化 (Gaussian Error Linear Unit)、tanh 近似版。
 *
 *   gelu(x) ≈ 0.5 * x * (1 + tanh(sqrt(2/π) * (x + 0.044715 * x^3)))
 *
 * PyTorch では `F.gelu(x, approximate="tanh")` がこの式と完全一致。
 * 教材として精度より読みやすさを優先し tanh 近似を採用。必要なら erf 版に
 * 切り替え可能 (未実装)。
 */
const GELU_COEF = Math.sqrt(2 / Math.PI);
function gelu(x, out) {
  const n = x.length;
  const y = out ?? new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const v = x[i];
    const inner = GELU_COEF * (v + 0.044715 * v * v * v);
    y[i] = 0.5 * v * (1 + Math.tanh(inner));
  }
  return y;
}

}

/**

 */

  A[r * cols + c] = v;

/**

 */
function transpose(A, M, N, out) {
  const At = out ?? new Float64Array(N * M);
  for (let i = 0; i < M; i++) {
    for (let j = 0; j < N; j++) {

    }
  }

/**
 * 要素ごとの加算 A += B (in-place)。A と B は同じ長さ。
 */
function addInPlace(A, B, len) {
  const n = len ?? A.length;

/**
