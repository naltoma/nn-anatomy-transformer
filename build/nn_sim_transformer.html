//
// 設計書 §5.1, §6 + §6.6 (Multi-Head) に対応。preset (hand-crafted の JSON) を
// 受け取って、入力 token 列に対する forward を計算する。学習機能は無い。
//
// すべての行列は Float64Array の 1 次元配列で持つ (matrix.js の規約)。
// アクセスは A[r * cols + c]。Multi-Head の Q/K/V/scores/attn/attnOut も
// 同じ Float64Array に格納し、head 軸はストライドで暗黙化する:
//   Q.length = T * h * d_k
//   Q[t, hi, k] = Q[(t * h + hi) * d_k + k]
//   scores.length = h * T * T
//   scores[hi, i, j] = scores[hi * T * T + i * T + j]


/**
 * preset (= JSON object) から Transformer net インスタンスを構築する。
 *
 * @param {object} args.preset  presets/japanese-mini-v1.json と同じ形式の object
 * @returns {object} net — 重みと中間結果バッファをすべて持つ object
 */
function createTransformer({ preset }) {
  if (!preset || !preset.config || !preset.weights) {
    throw new Error("createTransformer: preset には config と weights が必要");
  }
  const { T, d_model, h, d_k, vocabSize, N } = preset.config;
  if (h * d_k !== d_model) {
    throw new Error(`createTransformer: h*d_k (${h * d_k}) != d_model (${d_model})`);
  }
  if (N !== 1) {
    throw new Error(`Tier 2 の model.js は N=1 のみ対応。preset N=${N}`);
  }

  // 重み (固定、preset から読み込み)
  const W_E = fromNestedArray(preset.weights.W_E);     // (vocabSize, d_model)
  const W_P = fromNestedArray(preset.weights.W_P);     // (T, d_model)
  const block0 = preset.weights.blocks[0];
  const W_Q = fromNestedArray(block0.W_Q);             // (d_model, h*d_k)
  const W_K = fromNestedArray(block0.W_K);             // (d_model, h*d_k)
  const W_V = fromNestedArray(block0.W_V);             // (d_model, h*d_k)
  const W_O = fromNestedArray(block0.W_O);             // (h*d_k, d_model)
  // LayerNorm パラメータ (γ=1, β=0 で固定。学習要素ゼロ)
  // 1D ベクトルなので fromNestedArray (2D 用) は使わず Float64Array.from で読み込む。
  const LN1_gamma = Float64Array.from(block0.LN1_gamma); // (d_model,)
  const LN1_beta  = Float64Array.from(block0.LN1_beta);  // (d_model,)
  // FFN: 2 層 MLP (d_model → d_ff → d_model) + GELU
  const d_ff = preset.config.d_ff;
  const FFN_W1 = fromNestedArray(block0.FFN_W1);         // (d_model, d_ff)
  const FFN_b1 = Float64Array.from(block0.FFN_b1);       // (d_ff,)
  const FFN_W2 = fromNestedArray(block0.FFN_W2);         // (d_ff, d_model)
  const FFN_b2 = Float64Array.from(block0.FFN_b2);       // (d_model,)
  // FFN 後の 2 回目残差 + LN2
  const LN2_gamma = Float64Array.from(block0.LN2_gamma); // (d_model,)
  const LN2_beta  = Float64Array.from(block0.LN2_beta);  // (d_model,)

  // 中間結果バッファ (forward で書き込まれる)
  const tokens   = new Int32Array(T);
  const X        = new Float64Array(T * d_model);
  // Q/K/V は (T, h, d_k) を 1D 化。サイズは T * h * d_k = T * d_model
  const Q        = new Float64Array(T * h * d_k);
  const K        = new Float64Array(T * h * d_k);
  const V        = new Float64Array(T * h * d_k);
  // scores / attn は (h, T, T) を 1D 化。サイズは h * T * T
  const scores   = new Float64Array(h * T * T);
  const attn     = new Float64Array(h * T * T);
  // attnOut は (T, h, d_k) (= (T, h*d_k) と同等のメモリ)
  const attnOut  = new Float64Array(T * h * d_k);
  const Y        = new Float64Array(T * d_model);
  // 残差 + LayerNorm (Lesson 9)
  const residual1 = new Float64Array(T * d_model);
  const ln1_out   = new Float64Array(T * d_model);
  // FFN (Lesson 10)
  const ffn_pre  = new Float64Array(T * d_ff);   // GELU 入力 (= ln1_out · W1 + b1)
  const ffn_h    = new Float64Array(T * d_ff);   // GELU 出力 (= 検出器の活性)
  const ffn_out  = new Float64Array(T * d_model); // = ffn_h · W2 + b2
  const residual2 = new Float64Array(T * d_model); // = ln1_out + ffn_out
  const ln2_out   = new Float64Array(T * d_model); // block 最終出力

  return {
    // ハイパパラメータ
    T, d_model, h, d_k, d_ff, vocabSize, N,
    vocab: preset.config.vocab.slice(),

    // 重み (固定)
    W_E, W_P,
    blocks: [{
      W_Q, W_K, W_V, W_O,
      LN1_gamma, LN1_beta,
      FFN_W1, FFN_b1, FFN_W2, FFN_b2,
      LN2_gamma, LN2_beta,
    }],

    // 中間結果
    tokens, X, Q, K, V, scores, attn, attnOut, Y,
    residual1, ln1_out,
    ffn_pre, ffn_h, ffn_out, residual2, ln2_out,

    // メタ
    presetName: preset.name ?? "(unknown)",
    presetMeta: {
      kind: preset.kind,
      version: preset.version,
      tier: preset.tier,
      description: preset.description,
      designIntent: preset.designIntent,
    },
    phase: "idle",
  };
}

/**
 * Tier 2 forward (Multi-Head Self-Attention):
 *   X = W_E[tokens] + W_P
 *   Q_full = X · W_Q,  K_full = X · W_K,  V_full = X · W_V    (T × h*d_k)
 *   per head hi:
 *     scores_hi[i, j] = (Q[t=i, hi, :] · K[t=j, hi, :]) / √d_k
 *     attn_hi   = softmax(scores_hi)
 *     out_hi    = attn_hi · V_hi    (T × d_k)
 *   concat heads → (T, h*d_k = d_model)
 *   Y = concat · W_O     (T × d_model)
 *
 * 入力 tokens は長さ T の Int32Array (vocab id 列)。net.tokens にコピーして
 * net.X / Q / K / V / scores / attn / attnOut / Y を順に埋める。
 *
 * @param {object} net
 * @param {Int32Array | number[]} tokens
 * @returns {Float64Array} net.Y (出力)
 */
function forward(net, tokens) {
  const { T, d_model, h, d_k, vocabSize } = net;
  if (tokens.length !== T) {
    throw new Error(`forward: tokens.length=${tokens.length} !== T=${T}`);
  }
  // tokens を内部にコピー、範囲チェック
  for (let t = 0; t < T; t++) {
    const id = tokens[t];
    if (!Number.isInteger(id) || id < 0 || id >= vocabSize) {
      throw new Error(`forward: tokens[${t}]=${id} は範囲外 (0..${vocabSize - 1})`);
    }
    net.tokens[t] = id;
  }

  // (1) X = W_E[tokens] + W_P
  for (let t = 0; t < T; t++) {
    const tokenId = net.tokens[t];
    const wOff = tokenId * d_model;
    const pOff = t * d_model;
    const xOff = t * d_model;
    for (let d = 0; d < d_model; d++) {
      net.X[xOff + d] = net.W_E[wOff + d] + net.W_P[pOff + d];
    }
  }

  // (2) Q/K/V を「concat 全 head」の形で計算: shape (T, h*d_k) = (T, d_model)
  // matmul の出力サイズに合わせて、Q/K/V も内部レイアウトでは (T, h*d_k) = (T, d_model) と等価。
  const block0 = net.blocks[0];
  const hd = h * d_k;
  matmul(net.X, T, d_model, block0.W_Q, hd, net.Q);
  matmul(net.X, T, d_model, block0.W_K, hd, net.K);
  matmul(net.X, T, d_model, block0.W_V, hd, net.V);

  // (3) head ごとの scores/attn/out を計算
  // Q[t, hi, k] = net.Q[(t * h + hi) * d_k + k]?  ← W_Q の cols 0..hd-1 は
  //   col index = hi * d_k + k に対応する (hi: head index, k: head 内の dim)。
  // つまり Q の格納順は (T, h, d_k) を [t][hi][k] フラット化したものではなく、
  // (T, h*d_k) を [t][hi*d_k + k] とした **同じ** メモリレイアウト。
  // → どちらの解釈でも net.Q[(t * h + hi) * d_k + k] = net.Q[t * hd + hi * d_k + k] と同値。
  const invSqrtDk = 1 / Math.sqrt(d_k);
  // scores buffer は (h, T, T)
  for (let hi = 0; hi < h; hi++) {
    const sOff = hi * T * T;
    for (let i = 0; i < T; i++) {
      const qOff = i * hd + hi * d_k;
      for (let j = 0; j < T; j++) {
        const kOff = j * hd + hi * d_k;
        let s = 0;
        for (let k = 0; k < d_k; k++) {
          s += net.Q[qOff + k] * net.K[kOff + k];
        }
        net.scores[sOff + i * T + j] = s * invSqrtDk;
      }
    }
    // softmax row-wise on (T, T) sub-buffer
    softmax(net.scores.subarray(sOff, sOff + T * T), T, T,
            net.attn.subarray(sOff, sOff + T * T));
    // attnOut[t, hi, :] = sum_j attn[hi, t, j] * V[j, hi, :]  → (T, d_k)
    for (let i = 0; i < T; i++) {
      const oOff = i * hd + hi * d_k;
      // 初期化
      for (let k = 0; k < d_k; k++) net.attnOut[oOff + k] = 0;
      for (let j = 0; j < T; j++) {
        const a = net.attn[sOff + i * T + j];
        const vOff = j * hd + hi * d_k;
        for (let k = 0; k < d_k; k++) {
          net.attnOut[oOff + k] += a * net.V[vOff + k];
        }
      }
    }
  }

  // (4) Y = concat(attnOut) · W_O    (concat は attnOut のメモリ配置がすでに (T, h*d_k))
  matmul(net.attnOut, T, hd, block0.W_O, d_model, net.Y);

  // (5) 残差接続: residual1 = X + Y
  for (let t = 0; t < T; t++) {
    const off = t * d_model;
    for (let d = 0; d < d_model; d++) {
      net.residual1[off + d] = net.X[off + d] + net.Y[off + d];
    }
  }

  // (6) LayerNorm 1: ln1_out = γ * (residual1 - μ) / sqrt(σ² + ε) + β
  //   per-token (= 各行ごとに d_model 軸方向で正規化)。
  //   PyTorch F.layer_norm 互換 (有偏分散、分母 N=d_model)。
  const LN_EPS = 1e-5;
  layerNormPerToken(net.residual1, T, d_model, block0.LN1_gamma, block0.LN1_beta, net.ln1_out, LN_EPS);

  // (7) FFN: ffn_pre = ln1_out · W1 + b1   (T × d_ff)
  const d_ff = net.d_ff;
  matmul(net.ln1_out, T, d_model, block0.FFN_W1, d_ff, net.ffn_pre);
  for (let t = 0; t < T; t++) {
    const off = t * d_ff;
    for (let k = 0; k < d_ff; k++) net.ffn_pre[off + k] += block0.FFN_b1[k];
  }
  // (8) ffn_h = GELU(ffn_pre)
  gelu(net.ffn_pre, net.ffn_h);
  // (9) ffn_out = ffn_h · W2 + b2   (T × d_model)
  matmul(net.ffn_h, T, d_ff, block0.FFN_W2, d_model, net.ffn_out);
  for (let t = 0; t < T; t++) {
    const off = t * d_model;
    for (let d = 0; d < d_model; d++) net.ffn_out[off + d] += block0.FFN_b2[d];
  }

  // (10) 2 回目の残差: residual2 = ln1_out + ffn_out
  for (let t = 0; t < T; t++) {
    const off = t * d_model;
    for (let d = 0; d < d_model; d++) {
      net.residual2[off + d] = net.ln1_out[off + d] + net.ffn_out[off + d];
    }
  }
  // (11) LayerNorm 2: ln2_out = LayerNorm(residual2)
  layerNormPerToken(net.residual2, T, d_model, block0.LN2_gamma, block0.LN2_beta, net.ln2_out, LN_EPS);

  net.phase = "forward";
  return net.ln2_out;
}

// per-token LayerNorm: 各行ごとに d_model 軸方向で平均/分散を取って標準化、γ/β を適用。
function layerNormPerToken(input, T, d_model, gamma, beta, output, eps) {
  for (let t = 0; t < T; t++) {
    const off = t * d_model;
    let mu = 0;
    for (let d = 0; d < d_model; d++) mu += input[off + d];
    mu /= d_model;
    let var_ = 0;
    for (let d = 0; d < d_model; d++) {
      const dx = input[off + d] - mu;
      var_ += dx * dx;
    }
    var_ /= d_model;
    const invStd = 1 / Math.sqrt(var_ + eps);
    for (let d = 0; d < d_model; d++) {
      const x_norm = (input[off + d] - mu) * invStd;
      output[off + d] = gamma[d] * x_norm + beta[d];
    }
  }
}

/**
 * 状態を「forward 前」に戻す。重みは触らない。
 */
function reset(net) {
  net.tokens.fill(0);
  net.X.fill(0);
  net.Q.fill(0);
  net.K.fill(0);
  net.V.fill(0);
  net.scores.fill(0);
  net.attn.fill(0);
  net.attnOut.fill(0);
  net.Y.fill(0);
  net.residual1.fill(0);
  net.ln1_out.fill(0);
  net.ffn_pre.fill(0);
  net.ffn_h.fill(0);
  net.ffn_out.fill(0);
  net.residual2.fill(0);
  net.ln2_out.fill(0);
  net.phase = "idle";
}

// ─── Multi-Head アクセサ ──────────────────────────────────
// view.js / explain.js から「特定 head の (T, d_k) 部分」を取り出すヘルパ。
// メモリは net.Q etc. を共有する (subarray が view を返す)。

/**
 * net.Q / K / V の特定 head 分を (T, d_k) view として返す。
 *
 * メモリ配置: net.Q[t, hi, k] = net.Q[t * h * d_k + hi * d_k + k]
 * このとき特定 head の slice は連続ではなく、各 row が dt = h * d_k
 * 単位で step する。なので普通の subarray では取れず、コピーする。
 *
 * @param {Float64Array} buf  (T * h * d_k)
 * @param {number} T
 * @param {number} h
 * @param {number} d_k
 * @param {number} hi
 * @returns {Float64Array}  (T, d_k) を 1D 化したもの
 */
function headSliceTHD(buf, T, h, d_k, hi) {
  const out = new Float64Array(T * d_k);
  const hd = h * d_k;
  for (let t = 0; t < T; t++) {
    const src = t * hd + hi * d_k;
    const dst = t * d_k;
    for (let k = 0; k < d_k; k++) out[dst + k] = buf[src + k];
  }
  return out;
}

/**
 * net.scores / attn の特定 head 分を (T, T) view として返す。
 * メモリ配置: net.scores[hi, i, j] = net.scores[hi * T * T + i * T + j]
 * 特定 head は連続なので subarray で view を取れる。
 *
 * @param {Float64Array} buf  (h * T * T)
 * @param {number} T
 * @param {number} hi
 * @returns {Float64Array} 長さ T*T の view
 */
function headSliceHTT(buf, T, hi) {
  return buf.subarray(hi * T * T, (hi + 1) * T * T);
}


// ---------- view.js ----------

// view.js — Tier 1 ネットワーク・ビューの SVG 描画 + pan/zoom。
//
// 設計書 §7 (可視化) に対応:
//   - 中央パネルに行列ヒートマップを並べる (行ヘッダ = 単語ラベル、列ヘッダ = dim 番号)
//   - タブ (Embed / Q-K-V / Attn / Out) で表示する行列セットを切り替える
//   - SVG viewBox を drag/wheel で pan/zoom できる
//
// インタラクション (セルクリック → 式の展開、ホバーでハイライト) は P5 で追加する。
// 本ファイルは「現状の net.X / Q / K / V / scores / attn / attnOut / Y を読んで描く」だけ。


// ─── レイアウト定数 ────────────────────────────────────────

const LAYOUT = {
  cellW: 50,         // セルの幅 (10 px の値「+0.412」が収まる)
  cellH: 22,         // セルの高さ
  rowLabelW: 90,     // 行ラベル (例: "T0 これ") の幅
  colLabelH: 18,     // 列ラベル (例: "d0") の高さ
  matrixGap: 30,     // 行列間の縦余白
  matrixTitleH: 18,  // 行列名 (例: "X") の高さ
  matrixShapeH: 14,  // 行列形状 (例: "(T × d_model)") の高さ
};

const SVG_NS = "http://www.w3.org/2000/svg";

function el(tag, attrs = {}, children = []) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v));
  for (const c of (Array.isArray(children) ? children : [children])) {
    if (c == null) continue;
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

/**
 * View のインスタンスを作成。SVG ルート要素と net (model.js) を受け取り、
 * pan/zoom 状態と現在表示中タブを内部に持つ。
 *
 * @param {SVGElement} svg
 * @param {object} net — model.js の createTransformer 戻り値
 * @param {object} [handlers] — { onCellClick({matrix,row,col}) }
 * @returns {object} view
 */
function createView(svg, net, handlers = {}) {
  const view = {
    svg,
    net,
    activeTab: "embed",       // 'embed' | 'qkv' | 'attn' | 'out'
    viewBox: { x: 0, y: 0, w: 1000, h: 600 },
    naturalSize: { w: 1000, h: 600 },
    handlers,
    selection: null,          // { matrix, row, col }
  };
  installPanZoom(view);
  return view;
}

/**
 * 現在の選択 (= 「式の展開」で表示中のセル) を更新して再描画。
 */
function setSelection(view, sel) {
  view.selection = sel;
  renderAll(view);
}

/**
 * net の現在の値で SVG を全描画。Forward 後・タブ切り替え後・Reset 後に呼ぶ。
 */
function renderAll(view) {
  const { svg, net } = view;
  // 既存 children を全クリア
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  // ルート <g>。pan/zoom は viewBox で制御するので transform は使わない。
  const g = el("g", { class: "g-content" });
  svg.appendChild(g);

  // タブごとに「描画する行列リスト」を組み立て、縦に並べて描画する。
  const matrices = matricesForTab(view.activeTab, net);
  let yCursor = 8;
  let maxRight = 0;
  for (const spec of matrices) {
    const drawn = drawMatrix(g, spec, yCursor, view);
    yCursor = drawn.bottomY + LAYOUT.matrixGap;
    maxRight = Math.max(maxRight, drawn.rightX);
  }

  // viewBox の自然サイズを計算してリセット
  view.naturalSize.w = Math.max(maxRight + 16, 600);
  view.naturalSize.h = Math.max(yCursor + 16, 400);
  // 現在の viewBox サイズを保ったまま svg にセットし直す
  // (初回 / Fit ボタン押下時は applyZoomFit() で自然サイズ全体を表示)
  applyViewBox(view);
}

/**
 * 表示するタブを切り替えて再描画。
 *
 * 注意: applyZoomFit は naturalSize を参照するので、必ず renderAll で
 * 新しい naturalSize を計算した後に呼ぶ。順序を逆にすると、古いタブの
 * naturalSize で viewBox を設定してしまい初期表示が歪む。
 */
function setTab(view, tabName) {
  if (!["embed", "qkv", "attn", "out", "ffn"].includes(tabName)) {
    throw new Error(`Unknown tab: ${tabName}`);
  }
  view.activeTab = tabName;
  renderAll(view);     // まず新タブを描画 → naturalSize 更新
  applyZoomFit(view);  // 新しい naturalSize で全体表示にリセット
}

/**
 * pan/zoom: viewBox を初期 (= 全体表示) に戻す。
 */
function applyZoomFit(view) {
  view.viewBox.x = 0;
  view.viewBox.y = 0;
  view.viewBox.w = view.naturalSize.w;
  view.viewBox.h = view.naturalSize.h;
  applyViewBox(view);
}

/**
 * pan/zoom: ズーム倍率を 1.0× に固定 (中心を保ったまま)。
 */
function applyZoom100(view) {
  // viewBox の幅 = SVG の DOM 上の幅 にすれば 1px = 1 unit。
  const rect = view.svg.getBoundingClientRect();
  const cx = view.viewBox.x + view.viewBox.w / 2;
  const cy = view.viewBox.y + view.viewBox.h / 2;
  view.viewBox.w = rect.width || view.naturalSize.w;
  view.viewBox.h = rect.height || view.naturalSize.h;
  view.viewBox.x = cx - view.viewBox.w / 2;
  view.viewBox.y = cy - view.viewBox.h / 2;
  applyViewBox(view);
}

/**
 * 現在のズーム倍率を返す。
 * preserveAspectRatio="xMidYMid meet" は viewBox 全体を DOM 矩形に収めるよう
 * 一様縮小するので、実際のスケールは min(rect.w / vbW, rect.h / vbH)。
 * (X 軸比だけを返すと Y 軸が支配的なときに視覚スケールと大きくズレる。)
 */
function currentZoom(view) {
  const rect = view.svg.getBoundingClientRect();
  if (!rect.width || !rect.height || !view.viewBox.w || !view.viewBox.h) return 1.0;
  const sx = rect.width  / view.viewBox.w;
  const sy = rect.height / view.viewBox.h;
  return Math.min(sx, sy);
}

/**
 * 中心アンカーで viewBox を factor 倍する (factor < 1 でズームイン)。
 * ホイールズームと同じロジックをマウス位置の代わりに「中央」固定で適用。
 */
function applyZoomDelta(view, factor) {
  const cx = view.viewBox.x + view.viewBox.w / 2;
  const cy = view.viewBox.y + view.viewBox.h / 2;
  view.viewBox.w *= factor;
  view.viewBox.h *= factor;
  view.viewBox.x = cx - view.viewBox.w / 2;
  view.viewBox.y = cy - view.viewBox.h / 2;
  applyViewBox(view);
}

// ─── 内部ヘルパ ────────────────────────────────────────────

function applyViewBox(view) {
  const { x, y, w, h } = view.viewBox;
  view.svg.setAttribute("viewBox", `${x} ${y} ${w} ${h}`);
  view.svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
}

/**
 * 指定タブで表示する行列スペック群を組み立てる。
 * spec: { title, shape, rows, cols, data, mode, rowLabels, colLabels }
 *   mode = "signed" (青=負/赤=正) | "attn" (青濃淡 0..1)
 */
function matricesForTab(tab, net) {
  const T = net.T, D = net.d_model, K = net.d_k;
  const wordOf = (i) => net.vocab[net.tokens[i]] ?? "?";
  const tokenLabels = Array.from({ length: T }, (_, i) => `T${i} ${wordOf(i)}`);
  const dimLabels = (n) => Array.from({ length: n }, (_, i) => `d${i}`);

  if (tab === "embed") {
    // W_E から現在の tokens 分の行だけ抜き出した「ビュー」を一時的に作る。
    // Lesson 2 で「token 埋め込み」と「位置エンコーディング」を独立に観察するため、
    // X (= W_E + W_P) と並べて 3 行列を表示する。
    const WE_selected = new Float64Array(T * D);
    for (let t = 0; t < T; t++) {
      const tid = net.tokens[t];
      for (let d = 0; d < D; d++) {
        WE_selected[t * D + d] = net.W_E[tid * D + d];
      }
    }
    const posLabels = Array.from({ length: T }, (_, i) => `pos ${i}`);
    return [
      {
        matrixKey: "W_E",
        title: "W_E[tokens[t], :]   token 埋め込み (位置に依存せず token の意味だけ)",
        shape: `(T=${T}) × (d_model=${D})`,
        rows: T, cols: D, data: WE_selected, mode: "signed",
        rowLabels: tokenLabels, colLabels: dimLabels(D),
      },
      {
        matrixKey: "W_P",
        title: "W_P[t, :]   位置エンコーディング (token と無関係に位置だけで決まる sin/cos)",
        shape: `(T=${T}) × (d_model=${D})`,
        rows: T, cols: D, data: net.W_P, mode: "signed",
        rowLabels: posLabels, colLabels: dimLabels(D),
      },
      {
        matrixKey: "X",
        title: "X = W_E[tokens] + W_P   (上 2 つの和、Q/K/V 計算の入力)",
        shape: `(T=${T}) × (d_model=${D})`,
        rows: T, cols: D, data: net.X, mode: "signed",
        rowLabels: tokenLabels, colLabels: dimLabels(D),
      },
    ];
  }
  if (tab === "qkv") {
    // Tier 2 (Multi-Head): W_Q / W_K / W_V は global (d_model, h*d_k) で表示し、
    // 出力 Q / K / V は head 別に縦に並べる。各 head の cell は (T, d_k)。
    const block0 = net.blocks[0];
    const h = net.h;
    const HD = h * K;       // = d_model

    /** weight 行列の列ヘッダで「head 境界」を見せるためのラベル。
     * d_k=8 のとき: d0 d1 ... d7 | d0 d1 ... d7 を head 0/1 として表示。 */
    const colHeadLabels = (n) => Array.from({ length: n }, (_, c) => {
      const hi = Math.floor(c / K);
      const k  = c % K;
      return `h${hi}.d${k}`;
    });

    /** head hi の Q を (T, d_k) に切り出して spec を作る。 */
    const headSpec = (matrixKey, baseTitle, buf, hi) => ({
      matrixKey: `${matrixKey}_h${hi}`,
      title: `${baseTitle}   [head ${hi}]`,
      shape: `(T=${T}) × (d_k=${K})`,
      rows: T, cols: K,
      data: headSliceTHD(buf, T, h, K, hi),
      mode: "signed",
      rowLabels: tokenLabels, colLabels: dimLabels(K),
    });

    const specs = [
      { matrixKey: "W_Q",
        title: "W_Q   X[t] を Query 空間に射影する重み (preset で hand-crafted)",
        shape: `(d_model=${D}) × (h*d_k=${HD})`,
        rows: D, cols: HD, data: block0.W_Q, mode: "signed",
        rowLabels: dimLabels(D), colLabels: colHeadLabels(HD) },
    ];
    for (let hi = 0; hi < h; hi++) {
      specs.push(headSpec("Q", "Q = X · W_Q   各 token の「問い合わせ」", net.Q, hi));
    }
    specs.push({
      matrixKey: "W_K",
      title: "W_K   X[t] を Key 空間に射影する重み",
      shape: `(d_model=${D}) × (h*d_k=${HD})`,
      rows: D, cols: HD, data: block0.W_K, mode: "signed",
      rowLabels: dimLabels(D), colLabels: colHeadLabels(HD),
    });
    for (let hi = 0; hi < h; hi++) {
      specs.push(headSpec("K", "K = X · W_K   各 token の「ラベル」", net.K, hi));
    }
    specs.push({
      matrixKey: "W_V",
      title: "W_V   X[t] を Value 空間に射影する重み (Tier 2 では単位行列のまま)",
      shape: `(d_model=${D}) × (h*d_k=${HD})`,
      rows: D, cols: HD, data: block0.W_V, mode: "signed",
      rowLabels: dimLabels(D), colLabels: colHeadLabels(HD),
    });
    for (let hi = 0; hi < h; hi++) {
      specs.push(headSpec("V", "V = X · W_V   各 token が渡す「中身」", net.V, hi));
    }
    return specs;
  }
  if (tab === "attn") {
    // Tier 2: scores / attn は head 別に並べる。
    const h = net.h;
    const specs = [];
    for (let hi = 0; hi < h; hi++) {
      specs.push({
        matrixKey: `scores_h${hi}`,
        title: `scores = (Q · Kᵀ) / √d_k   [head ${hi}]`,
        shape: `(T=${T}) × (T=${T})`,
        rows: T, cols: T,
        data: headSliceHTT(net.scores, T, hi),
        mode: "signed",
        rowLabels: tokenLabels, colLabels: tokenLabels.slice(),
      });
      specs.push({
        matrixKey: `attn_h${hi}`,
        title: `attn = softmax(scores)   [head ${hi}]   (各行の和 = 1)`,
        shape: `(T=${T}) × (T=${T})`,
        rows: T, cols: T,
        data: headSliceHTT(net.attn, T, hi),
        mode: "attn",
        rowLabels: tokenLabels, colLabels: tokenLabels.slice(),
      });
    }
    return specs;
  }
  if (tab === "out") {
    // Tier 2: attnOut は head 別、Y は concat·W_O、residual1 は X+Y、ln1_out は LN(residual1)。
    const h = net.h;
    const specs = [];
    for (let hi = 0; hi < h; hi++) {
      specs.push({
        matrixKey: `attnOut_h${hi}`,
        title: `attnOut = attn · V   [head ${hi}]`,
        shape: `(T=${T}) × (d_k=${K})`,
        rows: T, cols: K,
        data: headSliceTHD(net.attnOut, T, h, K, hi),
        mode: "signed",
        rowLabels: tokenLabels, colLabels: dimLabels(K),
      });
    }
    specs.push({
      matrixKey: "Y",
      title: "Y = concat(attnOut) · W_O   (Multi-Head Attention の射影出力)",
      shape: `(T=${T}) × (d_model=${D})`,
      rows: T, cols: D, data: net.Y, mode: "signed",
      rowLabels: tokenLabels, colLabels: dimLabels(D),
    });
    specs.push({
      matrixKey: "residual1",
      title: "residual1 = X + Y   (残差接続: 元 token 情報を足し戻す)",
      shape: `(T=${T}) × (d_model=${D})`,
      rows: T, cols: D, data: net.residual1, mode: "signed",
      rowLabels: tokenLabels, colLabels: dimLabels(D),
    });
    specs.push({
      matrixKey: "ln1_out",
      title: "ln1_out = LayerNorm(residual1, γ=1, β=0)   (Attention 部の出力、各行の mean=0 / std≈1)",
      shape: `(T=${T}) × (d_model=${D})`,
      rows: T, cols: D, data: net.ln1_out, mode: "signed",
      rowLabels: tokenLabels, colLabels: dimLabels(D),
    });
    return specs;
  }
  if (tab === "ffn") {
    // FFN タブ: 重み (W1, W2) + 中間活性 (ffn_h) + 出力 (ffn_out) + 残差/LN2 を縦に並べる。
    const block0 = net.blocks[0];
    const d_ff = net.d_ff;
    const ffLabels = (n) => Array.from({ length: n }, (_, i) => `h${i}`);
    return [
      { matrixKey: "FFN_W1",
        title: "W1   ln1_out を d_ff 次元の検出器空間に射影する重み (preset で hand-crafted)",
        shape: `(d_model=${D}) × (d_ff=${d_ff})`,
        rows: D, cols: d_ff, data: block0.FFN_W1, mode: "signed",
        rowLabels: dimLabels(D), colLabels: ffLabels(d_ff) },
      { matrixKey: "ffn_h",
        title: "ffn_h = GELU(ln1_out · W1 + b1)   各 token の検出器ニューロン活性",
        shape: `(T=${T}) × (d_ff=${d_ff})`,
        rows: T, cols: d_ff, data: net.ffn_h, mode: "signed",
        rowLabels: tokenLabels, colLabels: ffLabels(d_ff) },
      { matrixKey: "FFN_W2",
        title: "W2   検出器活性を d_model に書き戻す重み",
        shape: `(d_ff=${d_ff}) × (d_model=${D})`,
        rows: d_ff, cols: D, data: block0.FFN_W2, mode: "signed",
        rowLabels: ffLabels(d_ff), colLabels: dimLabels(D) },
      { matrixKey: "ffn_out",
        title: "ffn_out = ffn_h · W2 + b2   FFN の出力",
        shape: `(T=${T}) × (d_model=${D})`,
        rows: T, cols: D, data: net.ffn_out, mode: "signed",
        rowLabels: tokenLabels, colLabels: dimLabels(D) },
      { matrixKey: "residual2",
        title: "residual2 = ln1_out + ffn_out   2 回目の残差接続",
        shape: `(T=${T}) × (d_model=${D})`,
        rows: T, cols: D, data: net.residual2, mode: "signed",
        rowLabels: tokenLabels, colLabels: dimLabels(D) },
      { matrixKey: "ln2_out",
        title: "ln2_out = LayerNorm(residual2, γ=1, β=0)   block 最終出力",
        shape: `(T=${T}) × (d_model=${D})`,
        rows: T, cols: D, data: net.ln2_out, mode: "signed",
        rowLabels: tokenLabels, colLabels: dimLabels(D) },
    ];
  }
  return [];
}

/**
 * 1 つの行列を SVG に描画。yTop から開始し、下端 / 右端の y, x を返す。
 * view: clickハンドラ呼び出しと selection ハイライトに使う。
 */
function drawMatrix(parent, spec, yTop, view) {
  const { matrixKey, title, shape, rows, cols, data, mode, rowLabels, colLabels } = spec;
  const sel = view?.selection;
  const isSelectedHere = sel && sel.matrix === matrixKey;

  // タイトル
  parent.appendChild(el(
    "text",
    { class: "matrix-label", x: 8, y: yTop + LAYOUT.matrixTitleH - 4 },
    title,
  ));
  parent.appendChild(el(
    "text",
    {
      class: "matrix-shape-label",
      x: 8,
      y: yTop + LAYOUT.matrixTitleH + LAYOUT.matrixShapeH - 4,
    },
    shape,
  ));

  // グリッドの起点
  const gridLeft = 8 + LAYOUT.rowLabelW;
  const gridTop = yTop + LAYOUT.matrixTitleH + LAYOUT.matrixShapeH + LAYOUT.colLabelH;

  // 値の絶対値の最大 (signed モードの色スケール用)
  let absMax = 0;
  for (let i = 0; i < rows * cols; i++) {
    const v = Math.abs(data[i]);
    if (v > absMax) absMax = v;
  }
  if (absMax === 0) absMax = 1;  // 全 0 のとき 0 除算回避

  // 列ヘッダ
  for (let c = 0; c < cols; c++) {
    parent.appendChild(el(
      "text",
      {
        class: "col-label",
        x: gridLeft + c * LAYOUT.cellW + LAYOUT.cellW / 2,
        y: gridTop - 4,
      },
      colLabels[c],
    ));
  }

  // 各行
  for (let r = 0; r < rows; r++) {
    const cellY = gridTop + r * LAYOUT.cellH;
    // 行ラベル
    parent.appendChild(el(
      "text",
      {
        class: "row-label",
        x: gridLeft - 6,
        y: cellY + LAYOUT.cellH / 2 + 4,
      },
      rowLabels[r],
    ));
    // セル
    for (let c = 0; c < cols; c++) {
      const cellX = gridLeft + c * LAYOUT.cellW;
      const v = data[r * cols + c];
      const fill = mode === "attn"
        ? attnFill(v)
        : signedFill(v, absMax);
      const isSelected = isSelectedHere && sel.row === r && sel.col === c;
      const cellClass = "cell-rect" + (isSelected ? " cell-selected" : "");
      const rect = el("rect", {
        class: cellClass,
        x: cellX, y: cellY,
        width: LAYOUT.cellW, height: LAYOUT.cellH,
        fill,
        "data-row": r, "data-col": c, "data-matrix": matrixKey,
      });
      // セルクリック → 選択 + handlers.onCellClick
      if (view && matrixKey) {
        rect.addEventListener("click", (ev) => {
          ev.stopPropagation();
          view.handlers?.onCellClick?.({ matrix: matrixKey, row: r, col: c });
        });
        // ドラッグ pan を妨げないよう、ホバー時はカーソル変更だけ。
        rect.style.cursor = "pointer";
      }
      parent.appendChild(rect);
      // セル内の数値
      const textClass = mode === "attn"
        ? (v >= 0.5 ? "cell-text attn-cell-text dark" : "cell-text attn-cell-text")
        : "cell-text";
      const txt = el("text", {
        class: textClass,
        x: cellX + LAYOUT.cellW / 2,
        y: cellY + LAYOUT.cellH / 2 + 1,
      }, formatCellValue(v, mode));
      txt.style.pointerEvents = "none";
      parent.appendChild(txt);
    }
  }

  const bottomY = gridTop + rows * LAYOUT.cellH;
  const rightX = gridLeft + cols * LAYOUT.cellW;
  return { bottomY, rightX };
}

function formatCellValue(v, mode) {
  if (!Number.isFinite(v)) return String(v);
  if (mode === "attn") return v.toFixed(2);
  // signed: 符号付き 3 桁
  const s = v.toFixed(3);
  return v >= 0 ? `+${s}` : s;
}

/**
 * signed モードのセル色 (青=負、白=0、赤=正、明度 = |v| / absMax)。
 */
function signedFill(v, absMax) {
  const t = Math.min(1, Math.abs(v) / absMax);  // 0..1
  // 透明度で表現するのは縞模様になるので、白から色へ補間
  if (v >= 0) {
    // 白 → 赤 (#c53030)
    const r = Math.round(255 - (255 - 197) * t);
    const g = Math.round(255 - (255 - 48) * t);
    const b = Math.round(255 - (255 - 48) * t);
    return `rgb(${r},${g},${b})`;
  } else {
    // 白 → 青 (#2b6cb0)
    const r = Math.round(255 - (255 - 43) * t);
    const g = Math.round(255 - (255 - 108) * t);
    const b = Math.round(255 - (255 - 176) * t);
    return `rgb(${r},${g},${b})`;
  }
}

/**
 * attn モードのセル色 (白=0、青濃=1)。0..1 の値を期待。
 */
function attnFill(v) {
  const t = Math.max(0, Math.min(1, v));
  const r = Math.round(255 - (255 - 43) * t);
  const g = Math.round(255 - (255 - 108) * t);
  const b = Math.round(255 - (255 - 176) * t);
  return `rgb(${r},${g},${b})`;
}

// ─── pan / zoom ────────────────────────────────────────────

function installPanZoom(view) {
  const svg = view.svg;
  let dragging = false;
  let lastClientX = 0, lastClientY = 0;

  svg.addEventListener("mousedown", (ev) => {
    if (ev.button !== 0) return;
    dragging = true;
    lastClientX = ev.clientX;
    lastClientY = ev.clientY;
    svg.classList.add("dragging");
  });

  window.addEventListener("mouseup", () => {
    if (dragging) {
      dragging = false;
      svg.classList.remove("dragging");
    }
  });

  window.addEventListener("mousemove", (ev) => {
    if (!dragging) return;
    const rect = svg.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    // 1 px の DOM 移動 = (viewBox.w / rect.width) ユニットの SVG 移動
    const dx = (ev.clientX - lastClientX) * (view.viewBox.w / rect.width);
    const dy = (ev.clientY - lastClientY) * (view.viewBox.h / rect.height);
    view.viewBox.x -= dx;
    view.viewBox.y -= dy;
    lastClientX = ev.clientX;
    lastClientY = ev.clientY;
    applyViewBox(view);
  });

  svg.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const rect = svg.getBoundingClientRect();
    if (!rect.width || !rect.height) return;

    // ホイール方向: 正 = ズームアウト (= viewBox.w 拡大)、負 = ズームイン
    const factor = ev.deltaY > 0 ? 1.15 : 1 / 1.15;

    // マウス位置を中心にズーム
    const mx = (ev.clientX - rect.left) / rect.width;   // 0..1
    const my = (ev.clientY - rect.top) / rect.height;   // 0..1
    const targetX = view.viewBox.x + mx * view.viewBox.w;
    const targetY = view.viewBox.y + my * view.viewBox.h;

    const newW = view.viewBox.w * factor;
    const newH = view.viewBox.h * factor;
    view.viewBox.x = targetX - mx * newW;
    view.viewBox.y = targetY - my * newH;
    view.viewBox.w = newW;
    view.viewBox.h = newH;
    applyViewBox(view);
  }, { passive: false });
}


// ---------- explain.js ----------

// explain.js — 「式の展開」HTML テンプレート。
// 設計書 §7.3 に対応。MLP 版 v1 の哲学を継承し、
// [段1] 一般形 → [段2] 当てはめ → [段3] 数値 の 3 段板書を作る。
//
// 引数: state = { net, selection: { matrix, row, col } }
//   matrix は文字列キー: preset 由来の重み行列 ("W_E" | "W_P" | "W_Q" | "W_K" | "W_V")
//                        または forward 由来の中間値 ("X" | "Q" | "K" | "V" | "scores" | "attn" | "attnOut" | "Y")
//
// 戻り値: HTML 文字列 (controller.js が ui.explainBody.innerHTML に流し込む)。

// ─── 数式レンダリング用ヘルパ ─────────────────────────────

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/**
 * Lesson 文中で使う、ごく軽量な markdown 風変換 + HTML エスケープ。
 *   1. まず HTML エスケープ
 *   2. その上で **xxx** を <b>xxx</b> に置換 (太字強調)
 * 改行は CSS の white-space: pre-line で処理する想定なので、ここでは触らない。
 */
function escapeAndBold(s) {
  return escapeHtml(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

// 変数 (italic) + subscript + superscript
function mv(name, sub, sup) {
  const n = `<i>${escapeHtml(name)}</i>`;
  const sb = (sub != null && sub !== "") ? `<sub>${escapeHtml(sub)}</sub>` : "";
  const sp = (sup != null && sup !== "") ? `<sup>${escapeHtml(sup)}</sup>` : "";
  return n + sb + sp;
}
function mn(v)  { return `<span class="mnum">${escapeHtml(v)}</span>`; }
function mo(op) { return `<span class="mop">${escapeHtml(op)}</span>`; }
function mline(html)        { return `<div class="line">${html}</div>`; }
function mblock(...lines)   { return `<div class="math">${lines.join("")}</div>`; }

function fmt(v, digits = 3) {
  if (!Number.isFinite(v)) return String(v);
  return (v >= 0 ? "+" : "") + v.toFixed(digits);
}
function fmtAttn(v, digits = 3) {
  if (!Number.isFinite(v)) return String(v);
  return v.toFixed(digits);
}

// 「T2 美しい」のようなラベル。token id→単語。
function tokenLabel(net, t) {
  const word = net.vocab[net.tokens[t]] ?? "?";
  return `T${t} ${word}`;
}

// ─── エントリポイント ─────────────────────────────────────

function renderExplainHtml(state) {
  const sel = state?.selection;
  if (!sel) {
    return `
      <p class="muted">
        中央パネルの行列のセルをクリックすると、ここにそのセルの計算式が
        [段1] 一般形 → [段2] 当てはめ → [段3] 数値 の 3 段で展開されます。
      </p>`;
  }
  const { net } = state;
  if (!net) return "";

  const phase = net.phase ?? "idle";
  // 行列キー正規化: "Q_h0" → { name: "Q", head: 0 }、"Q" → { name: "Q", head: null }
  const { name, head } = parseMatrixKey(sel.matrix);

  // forward 前でも見られる行列: 入力埋め込み X (precomputed) と preset 由来の重み行列。
  const PRESET_OK_AT_IDLE = new Set([
    "X", "W_E", "W_P", "W_Q", "W_K", "W_V", "FFN_W1", "FFN_W2",
  ]);
  if (phase === "idle" && !PRESET_OK_AT_IDLE.has(name)) {
    return `
      <p class="muted">
        ${escapeHtml(sel.matrix)}[${sel.row},${sel.col}] はまだ Forward が実行されていません。
        上部の <b>Forward</b> ボタンを押してから再度クリックしてください。
      </p>`;
  }

  switch (name) {
    case "W_E":     return renderWE(net, sel);
    case "W_P":     return renderWP(net, sel);
    case "W_Q":     return renderProjectionWeight(net, sel, "Q");
    case "W_K":     return renderProjectionWeight(net, sel, "K");
    case "W_V":     return renderProjectionWeight(net, sel, "V");
    case "X":       return renderEmbed(net, sel);
    case "Q":       return renderQKV(net, sel, "Q", head);
    case "K":       return renderQKV(net, sel, "K", head);
    case "V":       return renderQKV(net, sel, "V", head);
    case "scores":  return renderScores(net, sel, head);
    case "attn":    return renderAttn(net, sel, head);
    case "attnOut": return renderAttnOut(net, sel, head);
    case "Y":       return renderY(net, sel);
    case "residual1": return renderResidual1(net, sel);
    case "ln1_out":   return renderLN1(net, sel);
    case "FFN_W1":    return renderFFNWeight(net, sel, "W1");
    case "FFN_W2":    return renderFFNWeight(net, sel, "W2");
    case "ffn_h":     return renderFFNHidden(net, sel);
    case "ffn_out":   return renderFFNOut(net, sel);
    case "residual2": return renderResidual2(net, sel);
    case "ln2_out":   return renderLN2(net, sel);
    default:
      return `<p class="muted">未対応の行列: ${escapeHtml(sel.matrix)}</p>`;
  }
}

/** "Q_h0" → { name: "Q", head: 0 }、"Q" → { name: "Q", head: null } */
function parseMatrixKey(key) {
  const m = /^([A-Za-z_]+)_h(\d+)$/.exec(key);
  if (m) return { name: m[1], head: parseInt(m[2], 10) };
  return { name: key, head: null };
}

// ─── 各行列の式展開 ────────────────────────────────────────

function renderThreeStep(title, s1, s2, s3, note = "") {
  return `
    <div class="explain-section">
      <h4>${escapeHtml(title)}</h4>
      <h4 class="step-h">[段1] 一般形</h4>${s1}
      <h4 class="step-h">[段2] 当てはめ</h4>${s2}
      <h4 class="step-h">[段3] 数値</h4>${s3}
      ${note}
    </div>`;
}

// W_E[token_id, d] のセル — token 埋め込み (位置に依存しない)
function renderWE(net, sel) {
  const { row: t, col: d } = sel;  // ここでの row は (現在表示中の) token 位置
  const tokenId = net.tokens[t];
  const word = net.vocab[tokenId];
  const we = net.W_E[tokenId * net.d_model + d];

  const s1 = mblock(mline(
    `${mv("W_E", "id,d")} <span class="comment">  (id = ${escapeHtml(word)} の vocab id)</span>`
  ));
  const s2 = mblock(mline(
    `${mv("W_E")}${mo("[")}id=${tokenId} (${escapeHtml(word)})${mo(",")} d${d}${mo("]")}`
  ));
  const s3 = mblock(mline(
    `${mv("W_E")}${mo("[")}id=${tokenId}${mo(",")} d${d}${mo("]")} ${mo("=")} ${mn(fmt(we))}`
  ));
  return renderThreeStep(
    `W_E (token 埋め込み) — 位置とは無関係`,
    s1, s2, s3,
    `<p class="muted note">※ W_E は preset で hand-crafted (=「猫」は dim 0 (is_noun) と dim 9 (サイズ特徴) に値を持つ、など意味が割り当ててある)。設計書 §6.9.2 の表を参照。同じ token は位置 t によらず常に同じ W_E ベクトルを返す。</p>`,
  );
}

// W_P[t, d] のセル — 位置エンコーディング (token と無関係)
function renderWP(net, sel) {
  const { row: t, col: d } = sel;
  const wp = net.W_P[t * net.d_model + d];
  const isEven = (d % 2 === 0);
  const i = Math.floor(d / 2);          // 偶数 dim 2i / 奇数 dim 2i+1 の i
  const power = (2 * i) / net.d_model;  // 10000^(2i/d_model) の指数
  const base = Math.pow(10000, power);
  const theta = t / base;
  const fnName = isEven ? "sin" : "cos";

  const s1 = mblock(mline(
    isEven
      ? `${mv("W_P", "t,2i")} ${mo("=")} ${mv("sin")}${mo("(")}t ${mo("/")} 10000<sup>2i/d_model</sup>${mo(")")}`
      : `${mv("W_P", "t,2i+1")} ${mo("=")} ${mv("cos")}${mo("(")}t ${mo("/")} 10000<sup>2i/d_model</sup>${mo(")")}`
  ));
  const s2 = mblock(mline(
    `${mv("W_P")}${mo("[")}t=${t}${mo(",")} d=${d}${mo("]")} ${mo("=")} ${mv(fnName)}${mo("(")}` +
    `${t} ${mo("/")} 10000<sup>${(2 * i)}/${net.d_model}</sup>${mo(")")}`
  ));
  const s3 = mblock(
    mline(`10000<sup>${(2 * i)}/${net.d_model}</sup> ${mo("=")} ${mn(base.toFixed(4))}`),
    mline(`${t} ${mo("/")} ${mn(base.toFixed(4))} ${mo("=")} ${mn(theta.toFixed(4))}`),
    mline(`${mv(fnName)}${mo("(")}${mn(theta.toFixed(4))}${mo(")")} ${mo("=")} ${mn(fmt(wp))}`),
  );
  return renderThreeStep(
    `W_P (位置エンコーディング) — token と無関係に位置 t だけで決まる`,
    s1, s2, s3,
    `<p class="muted note">※ 偶数 dim には sin、奇数 dim には cos を使う。dim が大きいほど周期が長い (10000<sup>2i/d_model</sup> が大きくなる)。学習せず固定値。同じ位置 t なら、どの token のときでも W_P は完全に同じ値。</p>`,
  );
}

// W_Q / W_K / W_V[in d, out k] のセル — 射影行列の 1 要素。
// 行 i = 入力 dim (X 側)、列 j = 出力 dim (Q/K/V 側)。preset で hand-crafted。
function renderProjectionWeight(net, sel, which) {
  const { row: inD, col: outG } = sel;
  const HD = net.h * net.d_k;
  const W = (which === "Q") ? net.blocks[0].W_Q
          : (which === "K") ? net.blocks[0].W_K
          :                   net.blocks[0].W_V;
  const w = W[inD * HD + outG];
  const matName = `W_${which}`;
  const outName = which;
  const hi = Math.floor(outG / net.d_k);
  const localK = outG % net.d_k;

  const dimMeaning = INPUT_DIM_MEANING[inD] ?? `dim ${inD}`;
  const bondMeaning = BOND_MEANING[outG] ?? `head ${hi} の col ${localK}`;

  const s1 = mblock(mline(
    `${mv(matName, "inD, outG")} <span class="comment">  (= 入力 dim inD の値を、出力 col outG = h${hi}.d${localK} にどれだけ流すか)</span>`
  ));
  const s2 = mblock(mline(
    `${mv(matName)}${mo("[")}d${inD}${mo(",")} g${outG}${mo("]")} <span class="comment">  (g${outG} = h${hi}·d_k + d${localK})</span>`
  ));
  const s3 = mblock(mline(
    `${mv(matName)}${mo("[")}d${inD}${mo(",")} g${outG}${mo("]")} ${mo("=")} ${mn(fmt(w))}`
  ));

  let note = "";
  if (which === "V") {
    note = `<p class="muted note">※ 本シミュレータの W_V は単位行列 (対角だけ +1.000、他は 0)。つまり V = X となり、Value 経路は「埋め込みベクトルそのままを後段に渡す」教育的設計を採っている。</p>`;
  } else {
    const role = (which === "Q")
      ? "Query (= 各 token が「どんな相手を見たいか」の問い合わせ) を作る"
      : "Key   (= 各 token が「自分はこう参照される」と差し出すラベル) を作る";
    const interp = (Math.abs(w) > 1e-9)
      ? `→ X[t, d${inD}] (= ${escapeHtml(dimMeaning)}) が ${outName}[t, h${hi}, d${localK}] (= ${escapeHtml(bondMeaning)}) に係数 ${fmt(w)} で流れ込む。`
      : `→ X[t, d${inD}] (= ${escapeHtml(dimMeaning)}) は ${outName}[t, h${hi}, d${localK}] には寄与しない (このパスは preset で閉じている)。`;
    note = `<p class="muted note">※ ${escapeHtml(matName)} は X を ${role} 重み行列。preset では「各文法カテゴリの dim」を「特定の bond の global col」に流すよう hand-crafted。${interp}</p>`;
  }

  return renderThreeStep(
    `${matName} (X → ${outName} 射影の 1 要素) — preset 由来の固定値`,
    s1, s2, s3,
    note,
  );
}

// preset §6.9 の dim 設計 (W_Q/W_K の解釈用)
const INPUT_DIM_MEANING = {
  0: "is_noun (名詞カテゴリ)",
  1: "is_adjective (形容詞カテゴリ)",
  2: "is_pronoun (指示詞カテゴリ)",
  3: "is_predicate (述語カテゴリ)",
  8: "美しさ特徴",
  9: "サイズ特徴",
  10: "書物特徴",
  11: "人気度特徴",
};
// bond は Q → K の一方向。Tier 2 では bond は global col で識別。
// bond 0/1 = head 0 (cols 0,1)、bond 2 = head 1 (col 8)。
const BOND_MEANING = {
  0: "bond 0 = 形容詞 (Q) → 名詞 (K)  [head 0]",
  1: "bond 1 = 指示詞 (Q) → 名詞 (K)  [head 0]",
  8: "bond 2 = 述語 (Q) → 名詞 (K)  [head 1]",
};

// X[t, d] = W_E[token[t], d] + W_P[t, d]
function renderEmbed(net, sel) {
  const { row: t, col: d } = sel;
  const tokenId = net.tokens[t];
  const word = net.vocab[tokenId];
  const we = net.W_E[tokenId * net.d_model + d];
  const wp = net.W_P[t * net.d_model + d];
  const x = net.X[t * net.d_model + d];

  const s1 = mblock(mline(
    `${mv("X", "t,d")} ${mo("=")} ${mv("W_E", "token[t],d")} ${mo("+")} ${mv("W_P", "t,d")}`
  ));
  const s2 = mblock(mline(
    `${mv("X")}${mo("[")}${tokenLabel(net, t)}${mo(",")} d${d}${mo("]")} ${mo("=")} ` +
    `${mv("W_E")}${mo("[")}id=${tokenId} (${word})${mo(",")} d${d}${mo("]")} ${mo("+")} ` +
    `${mv("W_P")}${mo("[")}t=${t}${mo(",")} d${d}${mo("]")}`
  ));
  const s3 = mblock(mline(
    `${mn(fmt(we))} ${mo("+")} ${mn(fmt(wp))} ${mo("=")} ${mn(fmt(x))}`
  ));
  return renderThreeStep(
    `Embed (X) — トークン埋め込み + 位置エンコーディング`,
    s1, s2, s3,
    `<p class="muted note">※ W_E は token id ごとの埋め込み (hand-crafted)、W_P は固定の sin/cos 位置エンコーディング。</p>`,
  );
}

// Q[t, hi, k] = sum_d X[t, d] · W_?[d, hi*d_k + k]   (Tier 2: Multi-Head)
// view.js は head ごとに (T, d_k) を表示するので、sel.col は head 内ローカル col k。
// 重み W_? の global col は hi * d_k + k (= W のグローバル列 g) になる。
function renderQKV(net, sel, which, headIdx) {
  const { row: t, col: k } = sel;
  const D = net.d_model;
  const d_k = net.d_k;
  const h = net.h;
  const hi = (headIdx == null) ? 0 : headIdx;
  const g = hi * d_k + k;  // global col index (W_Q / Q_full の列)
  const W = (which === "Q") ? net.blocks[0].W_Q
          : (which === "K") ? net.blocks[0].W_K
          : net.blocks[0].W_V;
  const out = (which === "Q") ? net.Q
            : (which === "K") ? net.K
            : net.V;
  const v = out[t * h * d_k + hi * d_k + k];

  const s1 = mblock(mline(
    `${mv(which, "t,hi,k")} ${mo("=")} ${mv("Σ", "d")} ${mv("X", "t,d")} ${mo("·")} ` +
    `${mv(`W_${which}`, "d, hi·d_k+k")}`
  ));
  const s2 = mblock(mline(
    `${mv(which)}${mo("[")}${tokenLabel(net, t)}${mo(",")} h${hi}${mo(",")} d${k}${mo("]")} ${mo("=")} ` +
    `${mv("Σ", "d")} ${mv("X")}${mo("[")}t=${t}${mo(",")} d${mo("]")} ${mo("·")} ` +
    `${mv(`W_${which}`)}${mo("[")}d${mo(",")} g=${g}${mo("]")} <span class="comment">  (g = h${hi}·d_k + d${k} = ${g})</span>`
  ));

  // [段3] 数値展開: 0 でない項のみ抽出
  const lines = [];
  let total = 0;
  for (let d = 0; d < D; d++) {
    const x  = net.X[t * D + d];
    const wd = W[d * h * d_k + g];
    const prod = x * wd;
    total += prod;
    if (Math.abs(wd) < 1e-9) continue;
    lines.push(
      `${mv("X")}${mo("[")}t,${d}${mo("]")} ${mo("·")} ${mv(`W_${which}`)}${mo("[")}${d},g${g}${mo("]")} ${mo("=")} ` +
      `${mn(fmt(x))} ${mo("·")} ${mn(fmt(wd))} ${mo("=")} ${mn(fmt(prod))}`
    );
  }
  if (lines.length === 0) {
    lines.push(
      `<span class="comment"># すべての項で W_${which}[d, g${g}] = 0 のため寄与なし</span>`
    );
  }
  lines.push(
    `${mv(which)}${mo("[")}${tokenLabel(net, t)}${mo(",")} h${hi}${mo(",")} d${k}${mo("]")} ${mo("=")} ${mn(fmt(total))}`
  );
  const s3 = mblock(...lines.map(mline));

  const intent = which === "Q" ? "Query (このトークンが「何を見たいか」)"
              : which === "K" ? "Key   (このトークンが「何として参照されるか」)"
              : "Value (このトークンが「何を持ち寄るか」)";
  return renderThreeStep(
    `${which} — ${intent}   [head ${hi}]`,
    s1, s2, s3,
    `<p class="muted note">※ W_${which} は preset で hand-crafted。head ${hi} に割り当てられた cols (global g = ${hi * d_k}..${hi * d_k + d_k - 1}) のうち、bond 配線が立っている col だけ非ゼロが出る。</p>`,
  );
}

// scores[i, j] = (Q[i, :] · K[j, :]) / sqrt(d_k)
function renderScores(net, sel, headIdx) {
  const { row: i, col: j } = sel;
  const T = net.T;
  const d_k = net.d_k;
  const h = net.h;
  const hi = (headIdx == null) ? 0 : headIdx;
  const score = net.scores[hi * T * T + i * T + j];
  const sqrtDk = Math.sqrt(d_k);

  const s1 = mblock(mline(
    `${mv("scores", "hi,i,j")} ${mo("=")} ${mo("(")}${mv("Q", "i,hi,:")} ${mo("·")} ${mv("K", "j,hi,:")}${mo(")")} ${mo("/")} ${mv("√d_k")}`
  ));
  const s2 = mblock(mline(
    `${mv("scores")}${mo("[")}h${hi}, ${tokenLabel(net, i)} → ${tokenLabel(net, j)}${mo("]")} ${mo("=")} ` +
    `${mo("(")}${mv("Σ", "k")} ${mv("Q")}${mo("[")}i,h${hi},k${mo("]")} ${mo("·")} ` +
    `${mv("K")}${mo("[")}j,h${hi},k${mo("]")}${mo(")")} ${mo("/")} ${mn(sqrtDk.toFixed(3))}`
  ));

  // [段3]: 0 でない項を出す。head 内 (T, d_k) のオフセット計算
  const qBase = i * h * d_k + hi * d_k;
  const kBase = j * h * d_k + hi * d_k;
  const lines = [];
  let dot = 0;
  for (let k = 0; k < d_k; k++) {
    const q = net.Q[qBase + k];
    const kk = net.K[kBase + k];
    const prod = q * kk;
    dot += prod;
    if (Math.abs(prod) < 1e-9) continue;
    lines.push(
      `${mv("Q")}${mo("[i,h")}${hi}${mo(",")}${k}${mo("]")} ${mo("·")} ${mv("K")}${mo("[j,h")}${hi}${mo(",")}${k}${mo("]")} ${mo("=")} ` +
      `${mn(fmt(q))} ${mo("·")} ${mn(fmt(kk))} ${mo("=")} ${mn(fmt(prod))}`
    );
  }
  if (lines.length === 0) {
    lines.push(`<span class="comment"># Q · K のすべての項で 0 (= score = 0)</span>`);
  }
  lines.push(
    `${mv("Q")} ${mo("·")} ${mv("K")} ${mo("=")} ${mn(fmt(dot))}`
  );
  lines.push(
    `${mv("scores")} ${mo("=")} ${mn(fmt(dot))} ${mo("/")} ${mn(sqrtDk.toFixed(3))} ${mo("=")} ${mn(fmt(score))}`
  );
  const s3 = mblock(...lines.map(mline));

  const qkExcerpt = renderQKExcerpt(net, i, j, hi);

  return renderThreeStep(
    `scores — Attention スコア (内積 / √d_k)   [head ${hi}]`,
    s1, s2, s3,
    qkExcerpt +
    `<p class="muted note">※ √d_k = √${d_k} で割るのは d_k が大きいときに softmax が極端化しないためのスケーリング (元論文 §3.2.1)。Multi-Head の場合は各 head の d_k で割る。</p>`,
  );
}

// scores[hi, i, j] のセルクリック時に出す「Q[i, hi] と K[j, hi] の関連 dim 抜粋」表。
function renderQKExcerpt(net, i, j, hi) {
  const d_k = net.d_k;
  const h = net.h;
  const qBase = i * h * d_k + hi * d_k;
  const kBase = j * h * d_k + hi * d_k;
  const cols = [];
  for (let k = 0; k < d_k; k++) {
    const q = net.Q[qBase + k];
    const kk = net.K[kBase + k];
    if (Math.abs(q) > 1e-9 || Math.abs(kk) > 1e-9) {
      cols.push({ k, q, kk, prod: q * kk });
    }
  }
  if (cols.length === 0) {
    return `<p class="muted note">※ 関連 dim 抜粋: Q[${tokenLabel(net, i)}, h${hi}] も K[${tokenLabel(net, j)}, h${hi}] も全 dim で 0 のため、scores も 0。</p>`;
  }
  const head = `<th>dim</th>` + cols.map(c => `<th>h${hi}.d${c.k}</th>`).join("");
  const qRow = `<th>Q[i]</th>` + cols.map(c => `<td>${fmt(c.q)}</td>`).join("");
  const kRow = `<th>K[j]</th>` + cols.map(c => `<td>${fmt(c.kk)}</td>`).join("");
  const pRow = `<th>Q·K</th>` + cols.map(c => `<td>${fmt(c.prod)}</td>`).join("");
  return `
    <div class="qk-excerpt">
      <p class="qk-excerpt-cap">関連セル抜粋: head ${hi}, i = ${escapeHtml(tokenLabel(net, i))}, j = ${escapeHtml(tokenLabel(net, j))} (Q または K が 0 でない dim だけ)</p>
      <table class="qk-pair-table">
        <thead><tr>${head}</tr></thead>
        <tbody>
          <tr>${qRow}</tr>
          <tr>${kRow}</tr>
          <tr class="qk-prod-row">${pRow}</tr>
        </tbody>
      </table>
    </div>`;
}

// attn[hi, i, j] = softmax(scores[hi, i, :])[j]   (Tier 2: per-head softmax)
function renderAttn(net, sel, headIdx) {
  const { row: i, col: j } = sel;
  const T = net.T;
  const hi = (headIdx == null) ? 0 : headIdx;
  const sBase = hi * T * T;
  const a = net.attn[sBase + i * T + j];
  const score_ij = net.scores[sBase + i * T + j];

  const s1 = mblock(mline(
    `${mv("attn", "hi,i,j")} ${mo("=")} ${mv("softmax")}${mo("(")}${mv("scores", "hi,i,:")}${mo(")")}${mo("[")}j${mo("]")}`
  ));
  const s2 = mblock(mline(
    `${mv("attn")}${mo("[")}h${hi}, ${tokenLabel(net, i)} → ${tokenLabel(net, j)}${mo("]")} ` +
    `${mo("=")} ${mv("e")}<sup>${fmt(score_ij)}</sup> ${mo("/")} ` +
    `${mv("Σ", "j'")} ${mv("e")}<sup>scores[h${hi}, i, j']</sup>`
  ));

  // [段3] 数値: 各 j' について exp(score) と総和 (head 内のみ)
  let m = -Infinity;
  for (let jp = 0; jp < T; jp++) {
    const s = net.scores[sBase + i * T + jp];
    if (s > m) m = s;
  }
  let sum = 0;
  const lines3 = [];
  for (let jp = 0; jp < T; jp++) {
    const s = net.scores[sBase + i * T + jp];
    const e = Math.exp(s - m);
    sum += e;
    lines3.push(
      `${mv("e")}<sup>${fmt(s)} − max</sup> ` +
      `${mo("=")} ${mn(e.toFixed(4))} <span class="comment">  (${tokenLabel(net, jp)} に対する重み素材)</span>`
    );
  }
  lines3.push(
    `${mv("Σ")} ${mo("=")} ${mn(sum.toFixed(4))}`
  );
  lines3.push(
    `${mv("attn")}${mo("[")}h${hi}, i, j${mo("]")} ${mo("=")} ${mv("e")}<sup>${fmt(score_ij)} − max</sup> / ${mn(sum.toFixed(4))} ${mo("=")} ${mn(fmtAttn(a, 4))}`
  );
  const s3 = mblock(...lines3.map(mline));

  return renderThreeStep(
    `attn — Softmax 後の注目度   [head ${hi}]   (各行の和 = 1)`,
    s1, s2, s3,
    `<p class="muted note">※ 数値安定化のため、各 head の各行の max を引いてから exp を計算 (overflow 防止)。値の比率は不変。Multi-Head の softmax は head 内で独立に行う。</p>`,
  );
}

// attnOut[t, hi, k] = sum_j(attn[hi, t, j] · V[j, hi, k])   (Tier 2: per-head)
function renderAttnOut(net, sel, headIdx) {
  const { row: i, col: k } = sel;
  const T = net.T;
  const d_k = net.d_k;
  const h = net.h;
  const hi = (headIdx == null) ? 0 : headIdx;
  const v = net.attnOut[i * h * d_k + hi * d_k + k];
  const aBase = hi * T * T + i * T;

  const s1 = mblock(mline(
    `${mv("attnOut", "t,hi,k")} ${mo("=")} ${mv("Σ", "j")} ${mv("attn", "hi,t,j")} ${mo("·")} ${mv("V", "j,hi,k")}`
  ));
  const s2 = mblock(mline(
    `${mv("attnOut")}${mo("[")}${tokenLabel(net, i)}, h${hi}, d${k}${mo("]")} ${mo("=")} ` +
    `${mv("Σ", "j")} ${mv("attn")}${mo("[")}h${hi}, i, j${mo("]")} ${mo("·")} ${mv("V")}${mo("[")}j, h${hi}, ${k}${mo("]")}`
  ));

  const lines = [];
  let total = 0;
  for (let j = 0; j < T; j++) {
    const a = net.attn[aBase + j];
    const vj = net.V[j * h * d_k + hi * d_k + k];
    const prod = a * vj;
    total += prod;
    lines.push(
      `${mn(fmtAttn(a, 3))} ${mo("·")} ${mn(fmt(vj))} ${mo("=")} ${mn(fmt(prod))} ` +
      `<span class="comment">  (${tokenLabel(net, j)} の V から)</span>`
    );
  }
  lines.push(
    `${mv("attnOut")}${mo("[")}t, h${hi}, k${mo("]")} ${mo("=")} ${mn(fmt(total))}`
  );
  const s3 = mblock(...lines.map(mline));

  return renderThreeStep(
    `attnOut — Attention で集約した V   [head ${hi}]`,
    s1, s2, s3,
    `<p class="muted note">※ 各 j について attn と V の積を合計。attn が大きい j (= 注目しているトークン) の V の寄与が大きくなる。各 head 独立に集約し、最後に concat して W_O で射影する。</p>`,
  );
}

// Y[i, d] = sum_g concat(attnOut)[i, g] · W_O[g, d]   (Tier 2: g は h*d_k 軸)
function renderY(net, sel) {
  const { row: i, col: d } = sel;
  const HD = net.h * net.d_k;  // = d_model
  const W_O = net.blocks[0].W_O;
  const y = net.Y[i * net.d_model + d];

  const s1 = mblock(mline(
    `${mv("Y", "i,d")} ${mo("=")} ${mv("Σ", "g")} ${mv("attnOut_concat", "i,g")} ${mo("·")} ${mv("W_O", "g,d")} ` +
    `<span class="comment">  (g は head 軸を flatten した index)</span>`
  ));
  const s2 = mblock(mline(
    `${mv("Y")}${mo("[")}${tokenLabel(net, i)}${mo(",")} d${d}${mo("]")} ${mo("=")} ` +
    `${mv("Σ", "g")} ${mv("attnOut_concat")}${mo("[")}i, g${mo("]")} ${mo("·")} ${mv("W_O")}${mo("[")}g, ${d}${mo("]")}`
  ));

  const lines = [];
  let total = 0;
  // attnOut の (T, h*d_k) 配置は net.attnOut[i * HD + g] でアクセスできる。
  for (let g = 0; g < HD; g++) {
    const a = net.attnOut[i * HD + g];
    const w = W_O[g * net.d_model + d];
    const prod = a * w;
    total += prod;
    if (Math.abs(w) < 1e-9) continue;
    const hi = Math.floor(g / net.d_k);
    const k  = g % net.d_k;
    lines.push(
      `${mn(fmt(a))} ${mo("·")} ${mn(fmt(w))} ${mo("=")} ${mn(fmt(prod))} ` +
      `<span class="comment">  (g${g} = h${hi}.d${k})</span>`
    );
  }
  if (lines.length === 0) {
    lines.push(`<span class="comment"># W_O[g,d] が全て 0 のため寄与なし</span>`);
  }
  lines.push(`${mv("Y")} ${mo("=")} ${mn(fmt(total))}`);
  const s3 = mblock(...lines.map(mline));

  return renderThreeStep(
    `Y — Multi-Head Attention の射影出力 (concat · W_O)`,
    s1, s2, s3,
    `<p class="muted note">※ 本シミュレータでは W_O = 単位行列なので、Y = concat(attnOut)。各 head の出力がそのまま並ぶ identity 設計を hand-crafted で維持してある。</p>`,
  );
}

// residual1[t, d] = X[t, d] + Y[t, d]   (残差接続: 元の token 情報を attention 出力に足し戻す)
function renderResidual1(net, sel) {
  const { row: t, col: d } = sel;
  const D = net.d_model;
  const x = net.X[t * D + d];
  const y = net.Y[t * D + d];
  const r = net.residual1[t * D + d];

  const s1 = mblock(mline(
    `${mv("residual1", "t,d")} ${mo("=")} ${mv("X", "t,d")} ${mo("+")} ${mv("Y", "t,d")}`
  ));
  const s2 = mblock(mline(
    `${mv("residual1")}${mo("[")}${tokenLabel(net, t)}${mo(",")} d${d}${mo("]")} ${mo("=")} ` +
    `${mv("X")}${mo("[")}${tokenLabel(net, t)}${mo(",")} d${d}${mo("]")} ${mo("+")} ` +
    `${mv("Y")}${mo("[")}${tokenLabel(net, t)}${mo(",")} d${d}${mo("]")}`
  ));
  const s3 = mblock(mline(
    `${mn(fmt(x))} ${mo("+")} ${mn(fmt(y))} ${mo("=")} ${mn(fmt(r))}`
  ));

  return renderThreeStep(
    `residual1 — 残差接続 (元 token 情報 X を Multi-Head 出力 Y に足し戻す)`,
    s1, s2, s3,
    `<p class="muted note">※ 残差接続 (residual connection) の役目: attention で集めた情報 Y だけだと元の token 情報が失われがちなので、X をそのまま足し戻すことで「元の自分 + 周りから集めた情報」の合算ベクトルにする。深い Transformer での勾配消失を防ぐ働きもある。</p>`,
  );
}

// ln1_out[t, d] = γ_d * (residual1[t, d] - μ_t) / sqrt(σ²_t + ε) + β_d
function renderLN1(net, sel) {
  const { row: t, col: d } = sel;
  const D = net.d_model;
  const block0 = net.blocks[0];
  const gamma = block0.LN1_gamma[d];
  const beta  = block0.LN1_beta[d];
  // μ, σ² を行 t について計算
  let mu = 0;
  for (let dd = 0; dd < D; dd++) mu += net.residual1[t * D + dd];
  mu /= D;
  let var_ = 0;
  for (let dd = 0; dd < D; dd++) {
    const dx = net.residual1[t * D + dd] - mu;
    var_ += dx * dx;
  }
  var_ /= D;
  const eps = 1e-5;
  const sigma = Math.sqrt(var_ + eps);
  const r = net.residual1[t * D + d];
  const x_norm = (r - mu) / sigma;
  const y_out = gamma * x_norm + beta;

  const s1 = mblock(mline(
    `${mv("ln1_out", "t,d")} ${mo("=")} ` +
    `${mv("γ", "d")} ${mo("·")} ${mo("(")}${mv("residual1", "t,d")} ${mo("-")} ${mv("μ", "t")}${mo(")")} ${mo("/")} ` +
    `${mv("√(σ²")}<sub>t</sub>${mv(" + ε)")} ${mo("+")} ${mv("β", "d")}`
  ));
  const s2 = mblock(
    mline(`${mv("μ", "t")} ${mo("=")} (1 / d_model) ${mv("Σ", "d'")} ${mv("residual1")}${mo("[")}${tokenLabel(net, t)}, d'${mo("]")} ${mo("=")} ${mn(mu.toFixed(4))}`),
    mline(`${mv("σ²", "t")} ${mo("=")} (1 / d_model) ${mv("Σ", "d'")} ${mo("(")}${mv("residual1")}${mo("[")}${tokenLabel(net, t)}, d'${mo("]")} ${mo("-")} ${mv("μ", "t")}${mo(")²")} ${mo("=")} ${mn(var_.toFixed(4))}`),
    mline(`${mv("√(σ²")}<sub>t</sub>${mv(" + ε)")} ${mo("=")} ${mn(sigma.toFixed(4))} <span class="comment">  (ε = 1e-5 で 0 除算回避)</span>`),
  );
  const s3 = mblock(
    mline(`${mv("residual1")}${mo("[")}${tokenLabel(net, t)}, d${d}${mo("]")} ${mo("-")} ${mv("μ")} ${mo("=")} ${mn(fmt(r))} ${mo("-")} ${mn(mu.toFixed(4))} ${mo("=")} ${mn((r - mu).toFixed(4))}`),
    mline(`${mo("(")}${mn((r - mu).toFixed(4))}${mo(")")} ${mo("/")} ${mn(sigma.toFixed(4))} ${mo("=")} ${mn(x_norm.toFixed(4))} <span class="comment">  (標準化された値)</span>`),
    mline(`${mv("γ")}<sub>${d}</sub> ${mo("·")} ${mn(x_norm.toFixed(4))} ${mo("+")} ${mv("β")}<sub>${d}</sub> ${mo("=")} ${mn(gamma.toFixed(3))} ${mo("·")} ${mn(x_norm.toFixed(4))} ${mo("+")} ${mn(beta.toFixed(3))} ${mo("=")} ${mn(fmt(y_out))}`),
  );

  return renderThreeStep(
    `ln1_out — Layer Normalization (per-token、d_model 軸方向の正規化)`,
    s1, s2, s3,
    `<p class="muted note">※ LayerNorm は各 token (= 各行) について d_model 軸の平均 μ と分散 σ² を取り、(x - μ) / √(σ² + ε) で標準化したあと γ・β でスケール/シフトする。本シミュレータの γ = 1, β = 0 では純粋な「平均 0、標準偏差 1」への正規化になり、token ごとに値の分布の大きさが揃う。実 Transformer では γ, β も学習で「適切なスケール」を獲得する。</p>`,
  );
}

// ─── FFN (Feed-Forward Network、2 層 MLP + GELU) ──────────

// preset の FFN 検出器ニューロン意図 (build_preset.py の FFN_NEURON_INTENT と同期)
const FFN_NEURON_INTENT = {
  0: "名詞 dim (d0) 検出器",
  1: "形容詞 dim (d1) 検出器",
  2: "指示詞 dim (d2) 検出器",
  3: "述語 dim (d3) 検出器",
  4: "助詞「は」(d4) 検出器",
  5: "助詞「が」(d5) 検出器",
  6: "助詞「を」(d6) 検出器",
  7: "コピュラ「です」(d7) 検出器",
  8: "美しさ特徴 (d8) 検出器",
  9: "サイズ特徴 (d9) 検出器",
  10: "書物特徴 (d10) 検出器",
  11: "人気度特徴 (d11) 検出器",
  12: "AND: 名詞 ∧ 美しさ → 美しい名詞検出 (d8 を強化)",
  13: "AND: 名詞 ∧ サイズ → サイズを持つ名詞検出 (d9 を強化)",
  14: "AND: 名詞 ∧ 書物 → 書物検出 (d10 を強化)",
  15: "AND: 名詞 ∧ 人気度 → 人気な名詞検出 (d11 を強化)",
};

// W1 / W2 のセル — preset 由来の固定重み
function renderFFNWeight(net, sel, which) {
  const { row, col } = sel;
  const block0 = net.blocks[0];
  const W = which === "W1" ? block0.FFN_W1 : block0.FFN_W2;
  const matName = `FFN_${which}`;
  const inLabel = which === "W1" ? `d${row}` : `h${row}`;
  const outLabel = which === "W1" ? `h${col}` : `d${col}`;
  const cols = which === "W1" ? net.d_ff : net.d_model;
  const w = W[row * cols + col];

  const s1 = mblock(mline(
    `${mv(matName, "in,out")} <span class="comment">  (= 入力 ${inLabel} の値を、出力 ${outLabel} にどれだけ流すか)</span>`
  ));
  const s2 = mblock(mline(
    `${mv(matName)}${mo("[")}${inLabel}${mo(",")} ${outLabel}${mo("]")}`
  ));
  const s3 = mblock(mline(
    `${mv(matName)}${mo("[")}${inLabel}${mo(",")} ${outLabel}${mo("]")} ${mo("=")} ${mn(fmt(w))}`
  ));

  let note = "";
  if (which === "W1") {
    const hk = col;
    const intent = FFN_NEURON_INTENT[hk];
    if (intent) {
      note = `<p class="muted note">※ FFN_W1 の列 h${hk} は preset の検出器ニューロン: <b>${escapeHtml(intent)}</b>。各 token の ln1_out から該当 dim を「立っているか」判定する閾値ロジックを実現。</p>`;
    } else {
      note = `<p class="muted note">※ FFN_W1 の列 h${hk} は preset で未使用 (全 0)。</p>`;
    }
  } else {
    const hk = row;
    const intent = FFN_NEURON_INTENT[hk];
    if (intent) {
      note = `<p class="muted note">※ FFN_W2 の行 h${hk} (検出器: ${escapeHtml(intent)}) は、その活性を出力 d_model のどの dim に書き戻すかを定める。検出器の発火を「特定 dim の値強化」として後段に伝える。</p>`;
    } else {
      note = `<p class="muted note">※ h${hk} は preset で未使用なので、この行はすべて 0。</p>`;
    }
  }

  return renderThreeStep(
    `${matName} — FFN の射影重み (preset で hand-crafted)`,
    s1, s2, s3,
    note,
  );
}

// ffn_h[t, k] = GELU(Σ_d ln1_out[t, d] · W1[d, k] + b1[k])
function renderFFNHidden(net, sel) {
  const { row: t, col: k } = sel;
  const D = net.d_model;
  const block0 = net.blocks[0];
  const b1 = block0.FFN_b1[k];
  const intent = FFN_NEURON_INTENT[k] ?? `h${k} (preset で未使用)`;

  // 0 でない項のみ展開
  let z = b1;
  const lines2 = [];
  for (let d = 0; d < D; d++) {
    const w = block0.FFN_W1[d * net.d_ff + k];
    if (Math.abs(w) < 1e-9) continue;
    const x = net.ln1_out[t * D + d];
    z += x * w;
    lines2.push(
      `${mv("ln1_out")}${mo("[")}${tokenLabel(net, t)}, d${d}${mo("]")} ${mo("·")} ${mv("W1")}${mo("[")}d${d}, h${k}${mo("]")} ${mo("=")} ` +
      `${mn(fmt(x))} ${mo("·")} ${mn(fmt(w))} ${mo("=")} ${mn(fmt(x * w))}`
    );
  }
  if (lines2.length === 0) {
    lines2.push(`<span class="comment"># W1[d, h${k}] が全 d で 0 (= 検出器が preset で未使用)</span>`);
  }
  // GELU 計算
  const GELU_COEF = Math.sqrt(2 / Math.PI);
  const inner = GELU_COEF * (z + 0.044715 * z * z * z);
  const ge = 0.5 * z * (1 + Math.tanh(inner));

  const s1 = mblock(mline(
    `${mv("ffn_h", "t,k")} ${mo("=")} ${mv("GELU")}${mo("(")}${mv("Σ", "d")} ${mv("ln1_out", "t,d")} ${mo("·")} ${mv("W1", "d,k")} ${mo("+")} ${mv("b1", "k")}${mo(")")}`
  ));
  const s2 = mblock(...lines2.map(mline),
    mline(`${mv("b1")}${mo("[")}h${k}${mo("]")} ${mo("=")} ${mn(fmt(b1))}`),
    mline(`${mv("Σ + b1")} ${mo("=")} ${mn(fmt(z))} <span class="comment">  (= GELU 入力 ffn_pre[t, h${k}])</span>`),
  );
  const s3 = mblock(mline(
    `${mv("GELU")}${mo("(")}${mn(fmt(z))}${mo(")")} ${mo("=")} ${mn(fmt(ge))}`
  ));

  return renderThreeStep(
    `ffn_h — FFN 中間層の検出器活性   [h${k}: ${intent}]`,
    s1, s2, s3,
    `<p class="muted note">※ GELU は ReLU と似た滑らかな活性化で、入力が大きく正なら ≈ x、負なら ≈ 0 を返す。本 preset では W1 を「特定 dim 同時発火検出器」として作ってあるので、ffn_h[t, k] が正の大きな値 = 「token t において k 番ニューロンが捉えた特徴が立っている」と読める。</p>`,
  );
}

// ffn_out[t, d] = Σ_k ffn_h[t, k] · W2[k, d] + b2[d]
function renderFFNOut(net, sel) {
  const { row: t, col: d } = sel;
  const block0 = net.blocks[0];
  const d_ff = net.d_ff;
  const b2 = block0.FFN_b2[d];

  let total = b2;
  const lines = [];
  for (let k = 0; k < d_ff; k++) {
    const w = block0.FFN_W2[k * net.d_model + d];
    if (Math.abs(w) < 1e-9) continue;
    const a = net.ffn_h[t * d_ff + k];
    const prod = a * w;
    total += prod;
    const intent = FFN_NEURON_INTENT[k] ?? `h${k}`;
    lines.push(
      `${mv("ffn_h")}${mo("[")}t, h${k}${mo("]")} ${mo("·")} ${mv("W2")}${mo("[")}h${k}, d${d}${mo("]")} ${mo("=")} ` +
      `${mn(fmt(a))} ${mo("·")} ${mn(fmt(w))} ${mo("=")} ${mn(fmt(prod))} <span class="comment">  (h${k}: ${escapeHtml(intent)})</span>`
    );
  }
  if (lines.length === 0) {
    lines.push(`<span class="comment"># W2[*, d${d}] が全 0 のため寄与なし</span>`);
  }

  const s1 = mblock(mline(
    `${mv("ffn_out", "t,d")} ${mo("=")} ${mv("Σ", "k")} ${mv("ffn_h", "t,k")} ${mo("·")} ${mv("W2", "k,d")} ${mo("+")} ${mv("b2", "d")}`
  ));
  const s2 = mblock(...lines.map(mline),
    mline(`${mv("b2")}${mo("[")}d${d}${mo("]")} ${mo("=")} ${mn(fmt(b2))}`),
    mline(`${mv("ffn_out")}${mo("[")}${tokenLabel(net, t)}, d${d}${mo("]")} ${mo("=")} ${mn(fmt(total))}`),
  );
  const s3 = mblock(mline(
    `合計 = ${mn(fmt(total))}`
  ));

  return renderThreeStep(
    `ffn_out — FFN の出力 (検出器活性を d_model に書き戻し)`,
    s1, s2, s3,
    `<p class="muted note">※ W2 が「検出器の活性をどの dim に書き戻すか」を決めるので、発火した検出器に応じて出力 dim の特定 dim が強化される。本 preset では h12〜h15 の AND 検出器が「美しい名詞 → 美しさ +0.5」のように特徴 dim を上書き強化する。</p>`,
  );
}

// residual2[t, d] = ln1_out[t, d] + ffn_out[t, d]
function renderResidual2(net, sel) {
  const { row: t, col: d } = sel;
  const D = net.d_model;
  const a = net.ln1_out[t * D + d];
  const b = net.ffn_out[t * D + d];
  const r = net.residual2[t * D + d];

  const s1 = mblock(mline(
    `${mv("residual2", "t,d")} ${mo("=")} ${mv("ln1_out", "t,d")} ${mo("+")} ${mv("ffn_out", "t,d")}`
  ));
  const s2 = mblock(mline(
    `${mv("residual2")}${mo("[")}${tokenLabel(net, t)}, d${d}${mo("]")} ${mo("=")} ${mn(fmt(a))} ${mo("+")} ${mn(fmt(b))}`
  ));
  const s3 = mblock(mline(
    `${mv("residual2")} ${mo("=")} ${mn(fmt(r))}`
  ));

  return renderThreeStep(
    `residual2 — 2 回目の残差接続 (FFN 入力 + FFN 出力)`,
    s1, s2, s3,
    `<p class="muted note">※ FFN は「検出器が立った dim を強化」するだけの差分情報なので、元の ln1_out (= attention 部の出力) に足し戻して 2 回目の残差を作る。これにより attention で集めた情報も FFN で強化された情報もどちらも保持される。</p>`,
  );
}

// ln2_out[t, d] = LayerNorm(residual2)
function renderLN2(net, sel) {
  const { row: t, col: d } = sel;
  const D = net.d_model;
  const block0 = net.blocks[0];
  const gamma = block0.LN2_gamma[d];
  const beta  = block0.LN2_beta[d];
  let mu = 0;
  for (let dd = 0; dd < D; dd++) mu += net.residual2[t * D + dd];
  mu /= D;
  let var_ = 0;
  for (let dd = 0; dd < D; dd++) {
    const dx = net.residual2[t * D + dd] - mu;
    var_ += dx * dx;
  }
  var_ /= D;
  const eps = 1e-5;
  const sigma = Math.sqrt(var_ + eps);
  const r = net.residual2[t * D + d];
  const x_norm = (r - mu) / sigma;
  const y_out = gamma * x_norm + beta;

  const s1 = mblock(mline(
    `${mv("ln2_out", "t,d")} ${mo("=")} ${mv("γ", "d")} ${mo("·")} ${mo("(")}${mv("residual2", "t,d")} ${mo("-")} ${mv("μ", "t")}${mo(")")} ${mo("/")} ${mv("√(σ²")}<sub>t</sub>${mv(" + ε)")} ${mo("+")} ${mv("β", "d")}`
  ));
  const s2 = mblock(
    mline(`${mv("μ", "t")} ${mo("=")} ${mn(mu.toFixed(4))}, ${mv("σ²", "t")} ${mo("=")} ${mn(var_.toFixed(4))}, ${mv("√(σ²+ε)")} ${mo("=")} ${mn(sigma.toFixed(4))}`),
  );
  const s3 = mblock(
    mline(`(${mn(fmt(r))} ${mo("-")} ${mn(mu.toFixed(4))}) ${mo("/")} ${mn(sigma.toFixed(4))} ${mo("=")} ${mn(x_norm.toFixed(4))}`),
    mline(`${mv("γ")}<sub>${d}</sub> ${mo("·")} ${mn(x_norm.toFixed(4))} ${mo("+")} ${mv("β")}<sub>${d}</sub> ${mo("=")} ${mn(fmt(y_out))}`),
  );

  return renderThreeStep(
    `ln2_out — 2 回目の Layer Normalization (block 最終出力)`,
    s1, s2, s3,
    `<p class="muted note">※ ln2_out が 1 ブロック分の最終出力。次のブロック (本シミュレータでは N=1 なので無し) または最終予測層への入力になる。LN の効果は Lesson 9 と同じ: 各 token の dim 分布を平均 0・標準偏差 1 に揃える。</p>`,
  );
}

// ─── Attention Map (補助パネル常駐表示用、シンプルなテーブル HTML) ──

function renderAttentionMapHtml(net) {
  if (net.phase === "idle") {
    return `<p class="muted">Forward 後、ここに attention map が常駐表示されます。</p>`;
  }
  const T = net.T;
  const H = net.h;
  // Multi-Head: head ごとに 1 つずつ table を縦に並べる。
  let html = "";
  for (let hi = 0; hi < H; hi++) {
    html += `<div class="attmap-head"><h4 class="attmap-head-title">head ${hi}</h4>`;
    html += `<table class="attmap-table"><thead><tr><th></th>`;
    for (let j = 0; j < T; j++) {
      html += `<th class="attmap-col">${escapeHtml(tokenLabel(net, j))}</th>`;
    }
    html += `</tr></thead><tbody>`;
    const sBase = hi * T * T;
    for (let i = 0; i < T; i++) {
      html += `<tr><th class="attmap-row">${escapeHtml(tokenLabel(net, i))}</th>`;
      for (let j = 0; j < T; j++) {
        const v = net.attn[sBase + i * T + j];
        const t = Math.max(0, Math.min(1, v));
        const r = Math.round(255 - (255 - 43) * t);
        const g = Math.round(255 - (255 - 108) * t);
        const b = Math.round(255 - (255 - 176) * t);
        const fg = v >= 0.5 ? "#fff" : "#222";
        html += `<td class="attmap-cell" style="background:rgb(${r},${g},${b});color:${fg}">${v.toFixed(2)}</td>`;
      }
      html += `</tr>`;
    }
    html += `</tbody></table></div>`;
  }
  return html;
}


// ---------- controller.js ----------

// controller.js — UI と model.js / view.js を接続するエントリポイント。
// P4 では最小限: DEFAULT_PRESET をロードして、Sample セレクタで選んだ文に対し
// forward を実行 → view.js で行列ヒートマップを描画する。
// インタラクション (セルクリック、式の展開) は P5 で追加。


// ─── DOM ────────────────────────────────────────────────────

const $ = (id) => document.getElementById(id);

const ui = {
  lesson:       $("lesson"),
  sample:       $("sample"),
  btnForward:   $("btn-forward"),
  btnReset:     $("btn-reset"),
  phaseLabel:   $("phase-label"),

  svg:          $("net-svg"),
  btnZoomFit:   $("btn-zoom-fit"),
  btnZoom100:   $("btn-zoom-100"),
  btnZoomIn:    $("btn-zoom-in"),
  btnZoomOut:   $("btn-zoom-out"),
  zoomLabel:    $("zoom-label"),

  explainBody:  $("explain-body"),
  attmapBody:   $("attmap-body"),
  lessonBody:   $("lesson-body"),

  eventLog:     $("event-log"),
};

// ─── 状態 ───────────────────────────────────────────────────

const state = {
  net: null,
  view: null,
  sampleIdx: 0,
  selection: null,    // { matrix, row, col } — クリックされたセル
  currentLesson: null, // 選択中の Lesson (LESSONS のエントリ) | null
};

// ─── イベントログ ───────────────────────────────────────────

function log(msg) {
  const li = document.createElement("li");
  li.textContent = msg;
  ui.eventLog.appendChild(li);
  ui.eventLog.scrollTop = ui.eventLog.scrollHeight;
}

// ─── 初期化 ─────────────────────────────────────────────────

function init() {
  // Lesson セレクタ
  for (const lsn of LESSONS) {
    const opt = document.createElement("option");
    opt.value = lsn.id;
    opt.textContent = lsn.title;
    ui.lesson.appendChild(opt);
  }

  // Sample セレクタ
  for (let i = 0; i < SAMPLE_SENTENCES.length; i++) {
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = `#${i + 1}  ${SAMPLE_SENTENCES[i].join(" ")}`;
    ui.sample.appendChild(opt);
  }
  ui.sample.value = "0";

  // Net + view を構築
  state.net = createTransformer({ preset: DEFAULT_PRESET });
  state.view = createView(ui.svg, state.net, {
    onCellClick: onCellClick,
  });

  // 起動直後は最初のサンプルを net.tokens に書き込んでから (forward 前の状態で)
  // 描画する。これで Embed タブには W_E のままが見える状態になる。
  previewSampleInput();
  renderAll(state.view);
  // 初回ロード時は中央パネルを Fit 表示にする (viewBox は createView の初期値 1000×600 で
  // 立ち上がるが、Embed タブの自然サイズはそれと違うため)。
  // SVG のレイアウトが確定してからラベルを更新するため rAF を使う。
  applyZoomFit(state.view);
  requestAnimationFrame(updateZoomLabel);

  // タブ
  document.querySelectorAll(".view-tabs .tab").forEach((btn) => {
    btn.addEventListener("click", () => onViewTabClick(btn));
  });
  document.querySelectorAll(".side-tabs .tab").forEach((btn) => {
    btn.addEventListener("click", () => onSideTabClick(btn));
  });

  // ボタン
  ui.btnForward.addEventListener("click", onForward);
  ui.btnReset.addEventListener("click", onReset);
  ui.sample.addEventListener("change", onSampleChange);
  ui.lesson.addEventListener("change", onLessonChange);

  // pan/zoom コントロール
  ui.btnZoomFit.addEventListener("click", () => {
    applyZoomFit(state.view);
    updateZoomLabel();
  });
  ui.btnZoom100.addEventListener("click", () => {
    applyZoom100(state.view);
    updateZoomLabel();
  });
  // +10% は viewBox を 1/1.1 倍 (= 視覚を 1.1 倍に拡大)。−10% は逆。
  ui.btnZoomIn.addEventListener("click", () => {
    applyZoomDelta(state.view, 1 / 1.1);
    updateZoomLabel();
  });
  ui.btnZoomOut.addEventListener("click", () => {
    applyZoomDelta(state.view, 1.1);
    updateZoomLabel();
  });
  ui.svg.addEventListener("wheel", () => {
    // wheel 後のズーム倍率を表示更新 (view.js 側で viewBox は更新済み)
    requestAnimationFrame(updateZoomLabel);
  });
  // ドラッグ pan は viewBox.x/y のみ動かし倍率は変えないので更新不要

  // 補助パネルの「レッスン」タブに初期メッセージを描画
  renderLessonCard();

  log("[Init] preset=japanese-mini-v1, T=5, d_model=16, h=1");
}

function updateZoomLabel() {
  const z = currentZoom(state.view);
  ui.zoomLabel.textContent = `${z.toFixed(2)}×`;
}

// Sample 変更や Reset 後に「forward 前の状態」を準備する:
// - net.tokens に選択中サンプルの id 列を入れる
// - net.X 等は forward が走ってないのでクリア状態 (= reset() で 0 化)
function previewSampleInput() {
  const sample = SAMPLE_SENTENCES[state.sampleIdx];
  const ids = encode(sample);
  reset(state.net);
  // tokens は reset() で 0 にされるので、上書きする
  for (let t = 0; t < state.net.T; t++) state.net.tokens[t] = ids[t];
  // Embed タブに W_E + W_P が見えるよう、X だけ事前計算する。
  // (P4 では「Forward 前の状態でも何か絵が出る」のが大事。Q/K/V は 0 のまま)
  for (let t = 0; t < state.net.T; t++) {
    const off = t * state.net.d_model;
    const wOff = state.net.tokens[t] * state.net.d_model;
    const pOff = t * state.net.d_model;
    for (let d = 0; d < state.net.d_model; d++) {
      state.net.X[off + d] = state.net.W_E[wOff + d] + state.net.W_P[pOff + d];
    }
  }
  setPhase("idle (input previewed)");
}

function setPhase(label) {
  ui.phaseLabel.textContent = label;
}

function refreshExplain() {
  ui.explainBody.innerHTML = renderExplainHtml({
    net: state.net,
    selection: state.selection,
  });
}

function refreshAttentionMap() {
  ui.attmapBody.innerHTML = renderAttentionMapHtml(state.net);
}

function onCellClick({ matrix, row, col }) {
  state.selection = { matrix, row, col };
  setSelection(state.view, state.selection);
  refreshExplain();
  // クリックしたら自動で「式の展開」タブにフォーカスする
  activateSideTab("explain");
}

function activateSideTab(name) {
  document.querySelectorAll(".side-tabs .tab").forEach((b) => {
    b.classList.toggle("tab-active", b.getAttribute("data-side-tab") === name);
  });
  document.querySelectorAll("[data-side-panel]").forEach((p) => {
    p.classList.toggle("tab-panel-active", p.getAttribute("data-side-panel") === name);
  });
}

function activateViewTab(name) {
  document.querySelectorAll(".view-tabs .tab").forEach((b) => {
    b.classList.toggle("tab-active", b.getAttribute("data-view-tab") === name);
  });
  setTab(state.view, name);
  updateZoomLabel();
}

function renderLessonCard() {
  const lsn = state.currentLesson;
  if (!lsn) {
    ui.lessonBody.innerHTML = `
      <p class="muted">
        Lesson セレクタから Lesson 1〜Lesson 10 を選ぶと、ここに目的と「このレッスンでチェックすること (3 つ)」が表示されます。
      </p>`;
    return;
  }
  const checks = lsn.checks
    .map((c) => `<li>${escapeAndBold(c)}</li>`)
    .join("");
  ui.lessonBody.innerHTML = `
    <div class="lesson-card">
      <h3>${escapeHtml(lsn.title)}</h3>
      <p class="lesson-hint">${escapeAndBold(lsn.hint)}</p>
      <h4>このレッスンでチェックすること</h4>
      <ol class="lesson-checks">${checks}</ol>
    </div>`;
}

// (escapeHtml は explain.js から import 済み)

// ─── イベントハンドラ ────────────────────────────────────

function onSampleChange() {
  state.sampleIdx = parseInt(ui.sample.value, 10) || 0;
  state.selection = null;
  // Sample を変えても Lesson 選択は保持する。
  // (例: Lesson 2 Task 2 では「Sample を別文に切り替えても W_P が同じ」を観察する手順がある)
  // Lesson の sampleIdx と異なる Sample を選んだ場合は、現在の選択値で forward 状態を作り直す。
  previewSampleInput();
  if (state.currentLesson && state.currentLesson.runForward) {
    const ids = encode(SAMPLE_SENTENCES[state.sampleIdx]);
    forward(state.net, ids);
    setPhase("forward (sample change in lesson)");
  }
  renderAll(state.view);
  refreshExplain();
  refreshAttentionMap();
  log(`[Sample] #${state.sampleIdx + 1}: ${SAMPLE_SENTENCES[state.sampleIdx].join(" ")}`);
}

function onLessonChange() {
  const id = ui.lesson.value;
  if (!id) {
    state.currentLesson = null;
    renderLessonCard();
    return;
  }
  const lsn = getLesson(id);
  if (!lsn) return;
  state.currentLesson = lsn;
  // Lesson に従って Sample / View タブ / Forward を一括適用
  state.sampleIdx = lsn.sampleIdx;
  ui.sample.value = String(lsn.sampleIdx);
  state.selection = null;
  previewSampleInput();
  if (lsn.runForward) {
    const ids = encode(SAMPLE_SENTENCES[state.sampleIdx]);
    forward(state.net, ids);
    setPhase("forward (lesson auto)");
  } else {
    setPhase("idle (lesson preview)");
  }
  // 中央タブを Lesson 指定に合わせる
  activateViewTab(lsn.viewTab);
  // 補助パネルは「レッスン」タブをアクティブに
  activateSideTab("lesson");
  // 描画 / 各パネル更新
  renderAll(state.view);
  refreshExplain();
  refreshAttentionMap();
  renderLessonCard();
  log(`[Lesson] ${lsn.id}: ${lsn.title}`);
}

function onForward() {
  const sample = SAMPLE_SENTENCES[state.sampleIdx];
  const ids = encode(sample);
  forward(state.net, ids);
  setPhase("forward");
  renderAll(state.view);
  refreshExplain();
  refreshAttentionMap();
  // 主要 attention 関係をログに (Multi-Head: 各 head ごとに記録)
  const attn = state.net.attn;
  const T = state.net.T;
  const H = state.net.h;
  const headLabel = `[Forward] ${sample.join(" ")}`;
  for (let hi = 0; hi < H; hi++) {
    const sBase = hi * T * T;
    const lines = [];
    for (let i = 0; i < T; i++) {
      let bestJ = 0, bestV = -1;
      for (let j = 0; j < T; j++) {
        const v = attn[sBase + i * T + j];
        if (v > bestV) { bestV = v; bestJ = j; }
      }
      const queryWord = state.net.vocab[state.net.tokens[i]];
      const keyWord   = state.net.vocab[state.net.tokens[bestJ]];
      lines.push(`${queryWord} → ${keyWord} (${bestV.toFixed(2)})`);
    }
    log(`${headLabel} head${hi}: ${lines.join(",  ")}`);
  }
}

function onReset() {
  reset(state.net);
  state.selection = null;
  previewSampleInput();
  renderAll(state.view);
  refreshExplain();
  refreshAttentionMap();
  log(`[Reset]`);
}

function onViewTabClick(btn) {
  const tab = btn.getAttribute("data-view-tab");
  document.querySelectorAll(".view-tabs .tab").forEach((b) => {
    b.classList.toggle("tab-active", b === btn);
  });
  setTab(state.view, tab);
  updateZoomLabel();
}

function onSideTabClick(btn) {
  const tab = btn.getAttribute("data-side-tab");
  document.querySelectorAll(".side-tabs .tab").forEach((b) => {
    b.classList.toggle("tab-active", b === btn);
  });
  document.querySelectorAll("[data-side-panel]").forEach((p) => {
    p.classList.toggle("tab-panel-active", p.getAttribute("data-side-panel") === tab);
  });
}

// ─── 起動 ───────────────────────────────────────────────────

init();

</script>
  </body>
</html>
